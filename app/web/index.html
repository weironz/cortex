<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cortex — memory-native AI agent client">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cortex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    Favicon —— .ico 放在前面是**有意的**。

    它是多尺寸的（16/24/32/48），浏览器在标签页那一档会挑 16px 那张，
    而那张画的是简化版标识（外环 + 实心点）。favicon.png 是单张 32px，
    浏览器只能把它硬缩到 16 —— 母版的两道弧缩到 16px 会糊成一个灰点。

    .png 那条留着是给只认 PNG 的抓取器（部分 RSS 阅读器、聊天软件的
    链接预览）。两条都在，各取所需。
  -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48"/>
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32"/>

  <title>Cortex</title>
  <link rel="manifest" href="manifest.json">
  <!--
    ── 灭杀 service worker ─────────────────────────────────────

    这个应用**不用** service worker（构建带 `--pwa-strategy=none`），
    这段脚本的唯一使命是清掉**历史版本装进用户浏览器里的那一个**。

    为什么必须有：Flutter 默认的 SW 对 index.html 是「先走网络」、对
    main.dart.js 是「先走缓存」。两条策略叠起来就是一个**混版本**的应用 ——
    2026-08-16 实测：用户页面的标题来自新代码、错误文案来自三版之前的旧代码，
    此后每一次修复他的浏览器都一版没跑到，Ctrl+Shift+R 也无济于事
    （硬刷只绕过 HTTP 缓存，SW 的 Cache Storage 不归它管）。

    一个 API 客户端拿不到 SW 壳缓存的好处（数据全是动态的），却实打实
    吃到了版本错位的亏 —— 所以是删掉，不是修好它的更新时序。

    发现并卸载了 SW 才 reload（防循环：没有 SW 时这段什么都不做）。
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(
          regs.map(function (r) { return r.unregister(); })
        ).then(function () {
          if (!('caches' in window)) return [];
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          // SW 已卸、缓存已清 —— 这次 reload 之后拿到的才是服务器上的版本
          window.location.reload();
        });
      });
    }
  </script>

</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
