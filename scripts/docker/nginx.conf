# ══════════════════════════════════════════════════════════
#  cortex-web 的 nginx 配置
#
#  这个镜像只做一件事：把 Flutter Web 的静态产物发出去。
#  **它不反代任何 API** —— 路由分流在 traefik 那一层做
#  （见 docker-compose.deploy.yml）。少一层代理就少一处
#  「两边规则不一致」的地方，而 WebSocket 升级最容易死在那里。
# ══════════════════════════════════════════════════════════

# ── `.mjs` 的 MIME ───────────────────────────────────────────
#
# wasm-gc 的胶水脚本叫 `main.dart.mjs`，浏览器用 `import()` 按 **module**
# 加载它，而 module script 的 MIME 是 HTML 规范里的**强校验**：
#
#   Failed to load module script: Expected a JavaScript-or-Wasm module script
#   but the server responded with a MIME type of "application/octet-stream"
#
# nginx 的 `mime.types` 里**没有 .mjs**，于是它按 `default_type` 回
# `application/octet-stream` —— import() 当场被拒，整页白屏。
#
# 2026-10-24 就这么白了一版：所有 HTTP 都是 200、`grep '<html'` 也过、
# 版本探针答 0.1.37，只有真浏览器的 console 说得出这句话。
#
# 写在这里（`http` 层，conf.d 被 include 在 http 里）而不是 server 里：
# nginx 的 types 是父子**合并**的，这一条会并进基础镜像那份 mime.types。
types {
    text/javascript mjs;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Flutter Web 是单页应用：深链接（/session/xxx）在磁盘上没有对应文件，
    # 必须回落到 index.html，否则刷新页面就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 缓存策略 ──────────────────────────────────────────
    #
    # index.html 与 flutter_bootstrap.js **绝不能缓存**。
    # Flutter 的资源文件名不带内容哈希，版本更新靠 bootstrap 里的
    # buildId 与 version.json 判定 —— 把入口缓存住，用户会拿着旧的
    # bootstrap 去加载新的 main.dart.js，症状是白屏且控制台里
    # 只有一句语焉不详的加载失败。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # canvaskit 与 assets 的内容随版本走，可以放心长缓存。
    # 它们是这个应用里最大的几个文件（canvaskit.wasm 好几 MB）。
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── 压缩 ──────────────────────────────────────────────
    # main.dart.js 未压缩是 MB 级的。不开 gzip 时首屏在慢网络上非常难看。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    # `text/javascript` 这一项同时覆盖 `main.dart.mjs`（见上面 types 那段）
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    # ── 安全响应头 ────────────────────────────────────────
    # 刻意**不设** Content-Security-Policy：Flutter Web 需要
    # wasm-unsafe-eval 与 blob: worker，一份写错的 CSP 会让应用直接白屏，
    # 而且是那种「本地开发好好的，上线才白」的错法。要收紧就在 traefik 侧
    # 用 headers middleware 加，那样改一次不用重建镜像。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 容器编排层的探活打这里。不进 access log，否则日志里全是它
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
