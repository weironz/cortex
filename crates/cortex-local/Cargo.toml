[package]
name = "cortex-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 本地 agent —— 循环与工具跑在你的机器上，记忆仍在远端"

[[bin]]
name = "cortex-local"
path = "src/main.rs"

[dependencies]
cortex-core.workspace = true
cortex-agent.workspace = true
cortex-llm.workspace = true
cortex-proto.workspace = true
# 解析器三处共用，见 cortex-import 的 crate 文档
cortex-import.workspace = true

axum.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true

# 父进程存活探测在 unix 上用 kill(pid, 0)。Windows 走 tasklist，不需要它 ——
# 见 src/supervise.rs 里「为什么不直接调 Win32」
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
