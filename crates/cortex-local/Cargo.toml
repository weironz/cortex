[package]
name = "cortex-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 本地 agent —— 循环与工具跑在你的机器上，记忆仍在远端"

[[bin]]
name = "cortex-local"
path = "src/main.rs"

[dependencies]
cortex-core.workspace = true
cortex-agent.workspace = true
# 第三方 MCP server 接进来的工具。**依赖方向是 local -> mcp -> agent**：
# agent 循环不知道 MCP 存在，那条线不能反过来。
cortex-mcp.workspace = true
cortex-llm.workspace = true
cortex-proto.workspace = true
# 解析器三处共用，见 cortex-import 的 crate 文档
cortex-import.workspace = true

axum.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true
# 确认凭据必须直接来自内核 CSPRNG。不用 ULID 凑数：它高 48 位是时间戳，
# 随机位只有 80，而「窗口很短」不该被算进熵里。见 src/confirm.rs。
getrandom = "0.3"
hex = "0.4"

# 父进程存活探测在 unix 上用 kill(pid, 0)。Windows 走 tasklist，不需要它 ——
# 见 src/supervise.rs 里「为什么不直接调 Win32」
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# 让路由测试能**不开端口**地驱动 Router（`ServiceExt::oneshot`）。
# 这台开发机上新编出来的 exe 入站会被静默丢弃，绑端口的测试跑不了；
# 而路由拼错、字段名写错这类事恰恰只有过一遍 Router 才看得出来
tower = { version = "0.5", features = ["util"] }
