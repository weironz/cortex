[package]
name = "cortex-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex agent 循环与工具"

[dependencies]
cortex-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
cortex-llm.workspace = true
futures.workspace = true
similar.workspace = true
ignore.workspace = true
regex.workspace = true
async-trait.workspace = true

# 工具调用的规范类型（Tool / CallToolRequestParams / CallToolResult）。
# cortex-llm 只 re-export 了 Tool，其余几个要直接取。版本必须与
# goose-provider-types 依赖的那份一致（它写的是 "1.4"），否则会出现两份
# rmcp 共存、类型名字一样却不兼容。
rmcp = { version = "1.4", default-features = false }

# OS 级沙箱。只在 Linux 目标上编译 —— landlock/seccompiler 都是 Linux 专有，
# 写进通用 [dependencies] 会让 Windows / macOS 构建直接失败。
# macOS 走 /usr/bin/sandbox-exec，不需要额外 crate；Windows 没有对等物。
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# Windows 沙箱：受限令牌 + 工作区 ACL。见 `sandbox::windows` 的模块文档。
#
# 用 `windows-sys` 而不是 `windows`：这一层只调十来个原始 Win32 函数，
# 不需要 COM 包装与 RAII 类型，而 `windows` 会把编译时间拉长一个量级。
# 版本跟着依赖树里已有的那份（0.61），避免两份 windows-sys 共存。
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_Security_Isolation",
    "Win32_System_Memory",
]

# 这个测试目标自己写 `main`：它同时是**测试**和**沙箱 helper**，
# 这样跑的必然是当前这份代码编出来的 helper。理由写在文件头
[[test]]
name = "sandbox_escape_windows"
harness = false
