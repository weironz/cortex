[package]
name = "cortex-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex agent 循环与工具"

[dependencies]
cortex-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
cortex-llm.workspace = true
futures.workspace = true
async-trait.workspace = true

# 工具调用的规范类型（Tool / CallToolRequestParams / CallToolResult）。
# cortex-llm 只 re-export 了 Tool，其余几个要直接取。版本必须与
# goose-provider-types 依赖的那份一致（它写的是 "1.4"），否则会出现两份
# rmcp 共存、类型名字一样却不兼容。
rmcp = { version = "1.4", default-features = false }

# OS 级沙箱。只在 Linux 目标上编译 —— landlock/seccompiler 都是 Linux 专有，
# 写进通用 [dependencies] 会让 Windows / macOS 构建直接失败。
# macOS 走 /usr/bin/sandbox-exec，不需要额外 crate；Windows 没有对等物。
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
