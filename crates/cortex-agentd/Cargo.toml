[package]
name = "cortex-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 云端 agent 编排：按需拉起沙箱容器，并把请求反代进去"

[dependencies]
cortex-core.workspace = true
cortex-proto.workspace = true

# **`cortex-store` 在这儿，但它只装会话，不装记忆。**
#
# 这条以前写的是「这里没有 cortex-store，且不许加」。那句话现在只对了一半，
# 而错的那一半 2026-08-15 咬了一口：停掉记忆服务之后 agent **连上一句话都
# 读不到** —— 会话、消息、附件、同步流水全在记忆服务的库里，Cortex 离开它
# 什么都不是。边界当初不是设计出来的，是漂过去的（沙箱快照与自带 API key
# 都躺在那边，而它们跟记忆毫无关系）。
#
# 现在的划分：**会话是 Cortex 的，记忆是 Cormex 的**。判据一句话 ——
# 这张表离开记忆能力还有没有意义。
#
# 没变的那一半仍然成立、且仍然不许破：**记忆只通过 HTTP 用，没有记忆的
# store 句柄**。那正是第三方 agent（Claude Code / goose）走的同一条路，
# 自己人和外人用同一个 API，那个 API 才不会烂。
cortex-store.workspace = true

# 导出文件的解析器。**同一份要在 CLI、本地 agent、这里三处跑** ——
# 各写一份的症状是同一个文件在桌面端导进 812 段、网页端 790 段，
# 两边都不报错。见 cortex-import 的 crate 文档
cortex-import.workspace = true
# 附件的字节。**与 `cortex-store` 是两半，缺哪一半都是悬空引用**：那边写
# 指向字节的那一行，这边写字节本身。见 `src/blobs.rs` 的模块头
cortex-blob.workspace = true

# **供应商层。只依赖它，不要写 `goose-provider-types`** —— 那个 crate 没有
# `rustls-tls` feature（alpha 的每个版本都没有，TLS 后端只由 goose-providers
# 转发给 reqwest），根 Cargo.toml 里给它写了这个 feature，直接引用会让
# **依赖解析当场失败**。`cortex-llm` 已经把类型层整个 `pub use` 出来了。
cortex-llm.workspace = true

# 也没有 `cortex-agent`：这个进程不跑 agent 循环。循环在容器里那个
# `cortex-local` 上（`--exec-env=container`），这里只负责把它拉起来、
# 把请求原样送进去。

# 容器与卷的编排
bollard.workspace = true
# 反代进容器，以及向 cortexd 要委托凭据
reqwest.workspace = true
# `web_fetch` 那道闸要按 URL 规范解析主机（十进制/八进制写的 IP 由它归一，
# 见 url_guard 里那条测试）。与 cortex-blob / cortex-providers 同一版本
url = "2.5"
# 解 / 造 tar：文件端点全部经 docker 的 archive API，而那条端点的载荷就是
# tar。**不开默认 feature** —— 我们不需要它碰宿主文件系统
tar = { version = "0.4", default-features = false }
bytes = "1"
# 缓存标签与 spec hash（见 env.rs）
sha2 = "0.10"
hex = "0.4"

axum.workspace = true
# runner 的 trait 是 async trait
async-trait.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["time"] }
futures.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true

# ── 身份 ──
# 账号那几张表在 cortex_auth 里，与租户库分开一个池（见 state.rs::Accounts）
sqlx.workspace = true
# 密码哈希。**必须是 argon2id，不能是 SHA-256** —— 理由在 credentials.rs
# 的模块文档第一节：那把 SHA-256 是给「一台机器一把预共享 token」用的，
# 而密码是人选的，熵低，需要的是慢
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
# 盐与 refresh token 的熵。用 getrandom 而不是 rand：这里要的是内核熵源，
# 取不到时必须 panic 而不是回落到可预测的种子
getrandom = "0.3"
# 自带 API key 的信封加密（AES-256-GCM）。**要的是 AEAD，不是「加密」** ——
# 少了完整性那一半，库里那一行就是任何能写库的人都可以替换的。见 byo_key.rs
ring = "0.17"

tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tempfile = "3"
# `ServiceExt::oneshot`：不起监听端口，直接把请求喂给**真实的** `router()`。
# 这台开发机上新编出来的 exe 入站会被静默丢弃，绑端口的测试跑不了
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
