[package]
name = "cortex-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 供应商层：多 LLM 可切换，模型能力与价目来自内置目录"

[dependencies]
cortex-core.workspace = true
# 供应商实现在 `cortex-providers`（取件自 goose，此后自行维护）。
# 这一层做的是**装配与选择**：读配置挑供应商、按目录查模型能力与价目、
# 把两者拼成一个 `LlmClient`。协议细节全在那一侧。
cortex-providers = { workspace = true, features = ["rustls-tls"] }
# `Tool` 就是 rmcp 的那个。**与 cortex-providers 钉同一版** —— 版本错开的话
# 同一个类型会有两份，而报错长得像「expected Tool, found Tool」。
rmcp = { version = "1.8", default-features = false }
# 图像块要把 &[u8] 编成 base64。与 cortex-providers 钉同一个大版本，
# 免得多出一份 base64 实现。
base64 = "0.22"
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dotenvy.workspace = true
tracing-subscriber.workspace = true
