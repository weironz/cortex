[package]
name = "computer-dispatch-ledger"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "=2.0.19"
tokio = { version = "1.53", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
static_assertions = "=1.1.0"
serde = { version = "1.0", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }
