[package]
name = "cortexd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 守护进程：记忆引擎与同步服务"

[dependencies]
cortex-core.workspace = true
cortex-memory.workspace = true
cortex-llm.workspace = true
cortex-store.workspace = true
cortex-agent.workspace = true

# 直接依赖 sqlx 只为一件事：LISTEN/NOTIFY 需要一条**专属**长连接
# （PgListener），这是连接级能力，repository 抽象覆盖不到。
# 除此之外 cortexd 不写任何 SQL —— 那条线仍然收敛在 cortex-store。
sqlx.workspace = true
async-trait.workspace = true

tokio.workspace = true
tokio-stream = { workspace = true, features = ["time"] }
futures.workspace = true
axum.workspace = true
tower-http.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true
