[workspace]
resolver = "3"
members = [
    "crates/cortex-core",
    "crates/cortexd",
    "crates/cortex-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/weironz/cortex"

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core" }

# 异步运行时
tokio = { version = "1.53", features = ["full"] }

# 服务端
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# 数据库
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid", "macros", "migrate",
] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 基础设施
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
