---
# ══════════════════════════════════════════════════════════
#  装机 —— 低频、人在场、需要 root。
#
#      ansible-playbook provision.yml -e ansible_user=root
#
#  ⚠️ 第一次跑必须用 root：那时 cortex-deploy 这个账号还不存在。
#     之后再跑可以用默认的 cortex-deploy（它有 NOPASSWD sudo）。
#
#  它吃掉的是 docs/deploy.md 第二、三节那些手敲步骤。**幂等** ——
#  随时可以再跑一遍，只有真的变了的东西才报 changed。
#
#  ── 它刻意不做的事 ────────────────────────────────────────
#
#  **不写 .env.secrets。** 那是这台机器上唯一需要人动手的东西
#  （10 个凭据），playbook 只检查它在不在、不在就当场停并把清单打出来。
#  理由：ansible 用的是全权 SSH 密钥，而那把钥匙在 GitHub Secrets 里。
#  凭据留在节点上，至少它们不会在 GitHub 那边**再存一份**。
#
#  **不建 DNS 记录**，那在域名服务商那边。缺 A 记录的症状是 traefik 反复
#  申请证书失败、浏览器拿到自签证书，而应用本身看着「起来了」——
#  所以下面有一条 assert 先把它问清楚。
# ══════════════════════════════════════════════════════════
- name: 装一台 Cortex 节点
  hosts: cortex_nodes
  become: true
  gather_facts: true

  tasks:
    - name: 只支持 Debian 系（apt）
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          这份 playbook 只写了 apt 那条路（节点是 Debian/Ubuntu）。
          换发行版要改包名与 docker 源，不是改一行的事。

    # ── 依赖 ──────────────────────────────────────────────
    #
    # ⚠️ **刷索引与装包是两步，因为它们的失败含义完全不同。**
    #
    # 显然的写法是 `apt: name=[...] state=present update_cache=true` 一行完事。
    # 2026-08-23 在生产节点上实测撞死：那台 ECS 的源是阿里云**内网**镜像
    # （mirrors.cloud.aliyuncs.com / 100.100.2.148），连不上，于是
    #
    #     Failed to update apt cache after 5 retries:        ← 冒号后面是空的
    #
    # 整个 playbook 停在这里，而它要装的东西**本来就都在**（docker 三件套
    # 装着、requests 是 pip 装在 /usr/local 的）。一个「让索引别太旧」的
    # 辅助步骤，把装机主路径整个挡死了。
    #
    # 更糟的是 `--check --diff` 那次是**绿的** —— check 模式不真跑 apt
    # update，所以这个坑只在真跑时出现。（`apt-get update` 自己遇到这种
    # 情况是 rc=0 的：它降级用旧索引继续。ansible 把它当硬失败。）
    #
    # 所以：刷索引尽力而为，装包才是硬要求。包已装时 `state: present`
    # 根本不需要新索引；包没装而索引又不通时，下一步会自己报错，
    # 而那条错误说的是「装不上哪个包」，比「apt cache 刷不动」准得多。
    - name: 刷一下 apt 索引（失败不致命）
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_cache
      failed_when: false

    - name: 索引没刷上
      ansible.builtin.debug:
        msg: >-
          ⚠ apt 索引刷不动（多半是源不通），下面按现有索引装。
          包都已经在的话没有影响；真缺包的话下一步会报。
      when: apt_cache is failed

    - name: 装 docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    # ── python 的 requests ────────────────────────────────
    #
    # ⚠️ **判据是「import 得通」，不是「dpkg 里有这个包」。**
    #
    # 只有 docker_prune / docker_image_pull 要它（那两个走 Docker API）；
    # 核心的 docker_compose_v2 走 docker CLI，不需要。deploy.yml 开头那条
    # assert 查的也是 `import requests` —— 这里必须用同一个判据，不然两边
    # 对「装好了」的定义不一样。
    #
    # 2026-08-23 实测：生产这台上 requests 2.30.0 是 **pip 装在
    # /usr/local/lib/python3.10/dist-packages** 的，apt 眼里「没装」，
    # 于是无条件 `state: present` 会去拉 deb —— 而那台的源是阿里云内网
    # 镜像、连不上，装机就此停住。更荒谬的是：**就算装成功也没用**，
    # /usr/local 在 sys.path 里优先，apt 那份会被 pip 那份直接遮住。
    - name: python3 能 import requests 吗
      ansible.builtin.command:
        cmd: "{{ ansible_python_interpreter | default('/usr/bin/python3') }} -c 'import requests'"
      register: has_requests
      changed_when: false
      failed_when: false

    - name: 装 python3-requests（只在 import 不通时）
      ansible.builtin.apt:
        name: python3-requests
        state: present
      when: has_requests.rc != 0

    # ── 目录 ──────────────────────────────────────────────
    - name: 部署目录
      ansible.builtin.file:
        path: "{{ node_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ⚠️ **备份根的属主必须是 postgres 那个 uid，不能跟着上面一起 root。**
    #
    # 往这个目录里写的有两个进程，**两个都是容器里的 postgres（uid 70）**：
    #   - cortexdb 的 `archive_command`（每 60 秒一段 WAL）
    #   - 备份容器的 `pg_basebackup` / `pg_dump`
    #
    # 建成 root:root 0755 的后果 2026-08-25 在生产上量到了：
    # **`archived=0 / failed=33970`** —— 归档从配上那天起一次都没成功过，
    # 卡在第一段。三件事一起发生，而三件都不响：
    #   1. PITR 是假的（备份目录空的，只有全量都没有）；
    #   2. pg_wal 无限涨（没归档成功的段回收不掉，当时已 3.2 GB）；
    #   3. 日志里只有一行 `archive command failed with exit code 1`。
    #
    # 用数字 70 而不是名字 `postgres`：**宿主上没有这个用户**，
    # 写名字会让这一步直接失败。70 是 alpine 版 postgres 镜像里的 uid
    # （Debian 版是 999）—— 换底座镜像时这里要跟着改，而症状就是上面那三条。
    - name: 备份根（属主是容器里 postgres 的 uid，不是 root）
      ansible.builtin.file:
        path: "{{ cortex_backup_dir }}"
        state: directory
        owner: "{{ cortex_pg_uid }}"
        group: "{{ cortex_pg_uid }}"
        mode: "0750"

    # ── 部署账号 ──────────────────────────────────────────
    #
    # ⚠️ 这个账号**曾经**被 `restrict,command=` 钉死，只能跑一条
    #    /usr/local/sbin/cortex-deploy。改用 ansible 之后那道限制必须去掉：
    #    ansible 要把模块推过去执行，任何 forced command 都会挡住它。
    #
    #    也就是说这把密钥现在等于节点 root。能接受这一点，是因为推镜像的
    #    ACR 凭据本来就在同一个 GitHub Secrets 里，而 agentd 挂着
    #    docker.sock —— 那条路早就通到 root 了。要真正拿回「Actions 沦陷
    #    ≠ 节点 root」，该做的是把 registry 凭据换成 OIDC，不是守这道门。
    - name: 部署账号
      ansible.builtin.user:
        name: cortex-deploy
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true

    # ⚠️ **这一步不许被静默跳过。**
    #
    # 第一版写的是 `when: deploy_public_key is defined`，而那个变量哪儿都没
    # 定义 —— 于是整步安静地不执行，装完的机器连不上，而 playbook 全绿。
    # 那正是这个仓库的头号故障形状（造好了没人调用，数到第 13 次）。
    #
    # 现在公钥有默认值（group_vars 里那把 CI 用的），没配就当场报错。
    - name: 得有一把公钥可装
      ansible.builtin.assert:
        that:
          - deploy_public_key is defined
          - deploy_public_key | length > 0
          - deploy_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-)')
        fail_msg: >-
          deploy_public_key 没配（或者不像一把公钥）。它是 CI 连这台机器用的
          那把，值放 ansible/group_vars/cortex_nodes.yml —— **公钥进 git 是安全的**，
          私钥在 GitHub Secrets 的 DEPLOY_SSH_KEY 里。
          临时也可以 -e deploy_public_key='ssh-ed25519 AAAA…'。
        quiet: true

    - name: 部署账号的公钥
      ansible.posix.authorized_key:
        user: cortex-deploy
        key: "{{ deploy_public_key }}"
        # exclusive：这台机器上这个账号**只认这一把**。多出来的（手工加过的、
        # 上一把轮换掉的）会被清掉 —— 一把没人记得的旧钥匙留在 authorized_keys
        # 里，是最难发现的那种后门
        exclusive: true
        # 刻意**不带** key_options —— 见上面那段

    - name: 部署账号的 sudo 权限
      community.general.sudoers:
        name: cortex-deploy
        user: cortex-deploy
        commands: ALL
        nopassword: true
        # 这个模块会先 `visudo -c` 校验再落盘。手写文件的话，一个语法错的
        # sudoers 会把**所有人**挡在 sudo 外面 —— 那是少数真的回不去的故障

    # ── 这台机器上不该有第二条部署入口 ────────────────────
    #
    # 声明的是一个**持续有效**的约束，不是一次性清理：部署路径只有一条
    # （CI 跑 ansible 的 deploy.yml），应急路径只有一条（下面那个 `dc`）。
    # 多一条就多一个会改 `.env` 里 CORTEX_VERSION 的东西，而两边打架的表现
    # 是「节点上跑的版本不是 ansible 以为的那个」，没有任何报错。
    #
    # 具体清掉的是 2026-08-23 之前那套：`/usr/local/sbin/cortex-deploy`
    # （强制命令脚本，仓库里对应 deploy/node-deploy-policy.sh，已随 f4522f7
    # 删除）与它自己的 sudoers 片段。生产节点上已于 2026-08-23 清掉，
    # 新装的机器上本来就没有 —— 两种情况这一步都是 no-op。
    #
    # ⚠️ 那个脚本在凭据拆进 .env.secrets 之后其实已经跑不动了（它内部是裸
    # `docker compose`，读不到 CORTEX_PG_PASSWORD）。一度留着它当「ansible
    # 连不上时的退路」，那个理由是假的 —— 一条必然失败的退路比没有退路更糟：
    # 真出事时才发现它不工作，而那正是最不该发现这件事的时候。
    - name: 不许有旧的强制命令入口
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/cortex-deploy
        - /etc/sudoers.d/cortex-deploy-forced

    # ── 让节点上还能敲 compose ────────────────────────────
    #
    # ⚠️ **凭据搬进 .env.secrets 之后，裸 `docker compose` 在这台机器上是废的。**
    #
    # 2026-08-23 实测，节点上 `docker compose ps` 直接报：
    #
    #     required variable CORTEX_PG_PASSWORD is missing a value
    #
    # 因为 compose 只自动读 `.env`，而口令已经不在那儿了。部署本身不受影响
    # （deploy.yml 给的是 `env_files: [.env, .env.secrets]`），受影响的是**人**：
    # ps / logs / restart / 手动切版本，全都是排障时最先敲的那几条。
    #
    # 这也意味着 /usr/local/sbin/cortex-deploy 那条「退路」已经名存实亡 ——
    # 它内部同样是裸 compose（见它的 94 / 147 / 162 行）。留着一个必然失败的
    # 退路，比没有退路更糟：真出事时才发现它不工作，而那正是最不该发现这件事的时候。
    #
    # 为什么不用 COMPOSE_ENV_FILES 环境变量（compose 2.24+ 支持，这台是 2.29.2）：
    # 它是**全局**的。写绝对路径会让同机的 mica / cormex / neostor 也去读
    # /data/cortex/.env.secrets；写相对路径则会让它们找不到 `.env.secrets` 而报错。
    # 这台机器上有五个 compose 项目，一个全局变量按住所有人不是修复，是扩散。
    - name: compose 的包装脚本（带上两个 env 文件）
      ansible.builtin.copy:
        dest: "{{ node_dir }}/dc"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # 由 ansible 生成（provision.yml），手改会被下次装机覆盖。
          #
          # 凭据在 .env.secrets 里，而 docker compose 只自动读 .env ——
          # 裸敲 `docker compose ps` 会报 CORTEX_PG_PASSWORD missing。
          # 在这台机器上请一律用这个包装：
          #
          #     cd {{ node_dir }} && ./dc ps
          #     ./dc logs -f agentd
          #     ./dc up -d --no-deps agentd
          #
          # 应急切版本（GitHub 不可用时）：改 .env 里的 CORTEX_VERSION，
          # 再 `./dc up -d --no-deps cortexdb agentd web egress`。
          # 正常路径是 CI 跑 ansible 的 deploy.yml，别在这里长期绕过它 ——
          # 手改的 .env 会被下一次部署重新渲染掉。
          exec docker compose \
            --env-file {{ node_dir }}/.env \
            --env-file {{ node_dir }}/.env.secrets \
            "$@"

    # ── traefik 的外部网络 ────────────────────────────────
    - name: traefik 外部网络
      community.docker.docker_network:
        name: traefik-network
        state: present

    # ── 凭据：只检查，从不写 ──────────────────────────────
    - name: 看一眼 .env.secrets 在不在
      ansible.builtin.stat:
        path: "{{ node_dir }}/.env.secrets"
      register: secrets_file

    - name: 没有凭据就停在这里
      ansible.builtin.fail:
        msg: |
          {{ node_dir }}/.env.secrets 不存在。

          这是这台机器上**唯一**要人动手的一步，ansible 刻意不代劳
          （那把 SSH 密钥在 GitHub Secrets 里，凭据不该在那边再存一份）。

          在节点上建它，chmod 600，内容照 deploy/.env.example 的 B 节：

              CORTEX_PG_PASSWORD=       # openssl rand -hex 32
              RUSTFS_ACCESS_KEY=cortexadmin
              RUSTFS_SECRET_KEY=        # openssl rand -hex 32
              CORTEX_AUTH=token
              CORTEX_AUTH_TOKEN_SHA256= # cortex-agentd --generate-token
              CORTEX_SECRET_KEY=        # openssl rand -hex 32
              CORTEX_ADMIN_USERNAME=
              CORTEX_ADMIN_PASSWORD=
              DEEPSEEK_API_KEY=

          建好之后再跑一次这个 playbook。
      when: not secrets_file.stat.exists

    - name: 凭据文件的权限收紧
      ansible.builtin.file:
        path: "{{ node_dir }}/.env.secrets"
        owner: root
        group: root
        mode: "0600"

    # ── DNS ───────────────────────────────────────────────
    #
    # 不是这台机器能改的事，但缺了它的症状离原因很远：traefik 反复申请证书
    # 失败、浏览器拿到自签证书，而应用本身看着完全正常。所以在这里问一次。
    - name: 域名解析到本机了吗
      ansible.builtin.command:
        cmd: getent hosts {{ cortex_domain }}
      register: dns_check
      changed_when: false
      failed_when: false

    - name: 解析不到就说清楚
      ansible.builtin.fail:
        msg: >-
          {{ cortex_domain }} 解析不到。Let's Encrypt 的 HTTP-01 挑战要求域名
          先指向这台机器 —— 缺 A 记录时 traefik 会反复申请证书失败，
          而应用本身看着「起来了」，症状离原因很远。先去域名服务商那边加记录。
      when: dns_check.rc != 0

    - name: 装完了
      ansible.builtin.debug:
        msg: >-
          节点就绪。接下来跑：
          ansible-playbook deploy.yml -e version=X.Y.Z
