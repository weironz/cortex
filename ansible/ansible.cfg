# ══════════════════════════════════════════════════════════
#  ansible 只跑在**控制端**（GitHub runner 或你的笔记本）。
#  目标机器不装 ansible —— 但需要 python3（模块推过去要它执行）。
#
#    ansible-playbook provision.yml      # 装机，低频，人在场
#    ansible-playbook deploy.yml -e version=0.1.18
# ══════════════════════════════════════════════════════════
[defaults]
inventory = inventory.yml
# 输出按 YAML 排版。默认那种一行 JSON 在 CI 日志里根本读不了 ——
# 而部署失败时那一行正是你唯一有的东西
stdout_callback = yaml
# CI 里不需要 .retry 文件，它只会在 runner 上留一个没人看的产物
retry_files_enabled = False
# 部署是一台机器的事，收集 facts 是一次没必要的往返。
# 要用的 playbook 自己开
gathering = explicit
# 默认 30s 在跨境 SSH（GitHub runner → 阿里云）上偏紧
timeout = 60

[ssh_connection]
# 复用连接：一次部署有几十个 task，每个都重新握手的话光 RTT 就几十秒
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
