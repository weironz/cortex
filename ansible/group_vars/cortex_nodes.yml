# ══════════════════════════════════════════════════════════
#  节点的非敏感配置 —— 这些会被渲染进 /data/cortex/.env。
#
#  ⚠️ **一个凭据都不许写在这里。** 敏感项住在节点的
#  `/data/cortex/.env.secrets`，装机时人工写一次，ansible 只检查它在不在。
#  哪一项算敏感，见 `deploy/.env.example` 的 B 节。
# ══════════════════════════════════════════════════════════

node_dir: /data/cortex

# ── CI 连这台机器用的那把公钥 ─────────────────────────────
#
# **公钥进 git 是安全的** —— 它本来就是公开的那一半。私钥在 GitHub Secrets
# 的 `DEPLOY_SSH_KEY` 里，永远不进仓库。
#
# 放这里而不是每次 `-e` 传：不然「换机器一条命令」就不成立了，而且下一个人
# 不会知道该传什么。`provision.yml` 里有一条 assert，空着就当场报错 ——
# 第一版写的是 `when: … is defined`，于是整步安静地跳过、装完的机器连不上，
# 而 playbook 全绿。
#
# 取值（两条都行）：
#   ssh-keygen -y -f <私钥文件>                        # 从私钥推出公钥
#   ssh root@<节点> 'cat ~cortex-deploy/.ssh/authorized_keys'
#                                                      # 节点上现成的那把
#                                                      # ⚠️ 只取 `ssh-ed25519 …`
#                                                      #    那部分，**别抄前面的
#                                                      #    restrict,command=**
deploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFxWEymfiOIDKBjdAGZCvewEO0FpY7+uJWoBtK+lBqGn cortex-ci-deploy"

# ── 域名 ──────────────────────────────────────────────────
# compose 里 `${DOMAIN}` 没有默认值，缺了整份 compose 解析不了
cortex_domain: cortex.cloudcele.com

# ⚠️ **刻意留空，别填 https://cortex.cloudcele.com。**
#
# 它不是「站点地址」，是 `gallery.rs::public_base` 的**兜底开关**：填了就
# 以它为准，**跳过 `X-Forwarded-Prefix`**。而生产的 traefik 有 stripprefix，
# 那个头是 `/api` —— 填一个不带 `/api` 的值，分享链接就从
# `…/api/s/<id>` 变成 `…/s/<id>`，复制出去谁都打不开。
#
# 症状离原因极远（那段函数的注释自己写着「他不会怀疑到这一步」），而且
# agentd 照样健康、页面照样能开。留空则走三个头拼，那是设计上的主路径；
# 这一项只给「反代不设这些头」的部署兜底，生产不是那种部署。
#
# 2026-08-23 差点踩进去：第一版这里填的就是那个看起来天经地义的值。
cortex_public_url: ""

# ── 镜像 ──────────────────────────────────────────────────
cortex_registry: registry.cn-shenzhen.aliyuncs.com/willspace

# ── 会话库 ────────────────────────────────────────────────
cortex_pg_user: cortex
cortex_pg_db: cortex

# ── 对象存储 ──────────────────────────────────────────────
# ⚠️ rustfs 本身**不在这一栈**，它跟着记忆服务在 /data/cormex。
# 这里只是从内网连过去，凭据在 .env.secrets 里
s3_endpoint: http://cortex-rustfs:9000
s3_bucket: cortex-blobs
s3_region: us-east-1

# ── 记忆服务 ──────────────────────────────────────────────
# 另一个仓库、另一条版本线（github.com/weironz/cormex）
cortex_memory_url: http://cormex:8080

# ── LLM ───────────────────────────────────────────────────
cortex_llm_provider: deepseek
# 留空 = 走 `config.rs::default_model(provider)`，deepseek 那一支恰好就是
# `deepseek-v4-pro` / `deepseek-v4-flash` —— 与节点 .env 里手写的那两行
# 逐字相同，所以留空不是降级。要钉死某个模型再填。
# （`optional()` 把空串当未设，有 `env_empty_is_unset.rs` 钉着）
cortex_llm_model: ""
cortex_llm_cheap_model: ""

# ── 云沙箱 ────────────────────────────────────────────────
# ⚠️ 开它 = 把这台机器的 root 交给 agentd（docker.sock）。
# 这台机器上还跑着 mica / neostor / headscale / rustdesk。
#
# **生产上它是开着的**（2026-08-23 核对：节点 .env 里 CORTEX_SANDBOX_ENABLED=1、
# COMPOSE_PROFILES=sandbox，cortex-egress 与沙箱容器都在跑）。这里第一版写的是
# false —— 那不是一个保守的默认，而是**一次静默的功能下线**：ansible 渲染的
# .env 会关掉 profile，egress 掉出编排、在跑的会话断，而部署全绿。
#
# 接管一个已有系统时，配置源的初值必须是**它当下的真实状态**，不是我们
# 认为合理的状态。要改配置就单独改一次，别混在「换部署工具」这一步里。
cortex_sandbox_enabled: true
# stat -c %g /var/run/docker.sock —— **必须自己查**，因发行版而异。
# 写错的表现是 agentd `client error (Connect)` 然后 restart 循环，
# 而那条错误读起来像「docker 没起来」
cortex_docker_gid: 126
cortex_egress_allow: "*"
cortex_egress_deny: ""

# ── 资源上限 ──────────────────────────────────────────────
# 这台是 2 核 3.5G，上面还有别人的四个服务。cpus 不该超过核数
agentd_cpu_limit: "1.0"
agentd_mem_limit: 512m
cortex_pg_cpu_limit: "0.5"
cortex_pg_mem_limit: 384m
cortex_egress_cpu_limit: "0.5"
cortex_egress_mem_limit: 128m

# ── 日志 ──────────────────────────────────────────────────
agentd_log: cortex_agentd=info,warn
cortex_egress_log: cortex_egress_proxy=info,warn

# ── 备份 ──────────────────────────────────────────────────
cortex_backup_dir: /data/cortex/backup

# ══════════════════════════════════════════════════════════
#  部署行为
# ══════════════════════════════════════════════════════════

# 这次部署要动哪些服务。
#
# ⚠️ **compose 里每个服务都必须在这里、或在 deploy_unmanaged 里。**
# deploy.yml 有一条 assert 当场拒绝没归宿的服务 —— 那条闸不是洁癖：
# 「往 compose 里加了服务却没人启动它」这个形状**犯过三次**
# （egress 险些、agentd 漏了一整次发布、cortexdb 让 v0.1.10 上线回滚），
# 而症状是沉默的：部署全绿，只是那个服务从来没起来过。
deploy_services:
  - cortexdb
  - agentd
  - web
# 沙箱开着时追加（profile 没激活时 compose 根本不认识 egress）
deploy_services_sandbox:
  - egress
# 异地备份开着时追加（同上：profile 没激活时 compose 不认识 backup）
deploy_services_backup:
  - backup

# 异地备份开不开。**默认关** —— 没配 OSS 凭据的部署拉起它只会每天失败
# 一次，而那种噪音会让人学会忽略备份告警。
# 打开之前先把 .env.secrets 里那五个 OSS_* / CORTEX_BACKUP_PASSWORD 填好。
# 2026-08-25 打开。桶 cortex-backup-cloudcele（深圳），凭据在节点的
# .env.secrets 里（ansible 从不碰它）。取舍见 docs/backup.md。
cortex_backup_enabled: true

# 容器里 postgres 的 uid。备份根按它 chown —— 见 provision.yml 那段 ⚠️。
# 70 = alpine 版 postgres 镜像；Debian 版是 999。换底座就要改这里，
# 而改漏的症状是「归档一次都没成功过，且没有任何告警」。
cortex_pg_uid: 70
backup_hour: 3
keep_daily: 7
keep_weekly: 4
keep_monthly: 6
cortex_backup_check_dow: 7
cortex_backup_cpu_limit: "0.75"
cortex_backup_mem_limit: 512M

# 明确说明「不归这次部署管」的服务。加进来要写清为什么。
deploy_unmanaged: []

# 镜像清理：保留最新几个**版本**（不是几个镜像）。
# 上一版必须留着 —— 回滚要用它，而它已经在本地，不需要 registry
keep_versions: 3

# ── 发信（阿里云邮件推送）──────────────────────────────
#
# 只用来发「绑定邮箱」的验证码。**留空 = 这个部署不发信**，绑定邮箱那条路
# 在界面上根本不出现（宁可少一个功能，不要一个点了必然失败的按钮）。
#
# ⚠️ 两个凭据不在这里，也不在任何被 git 跟踪的文件里 —— 人工写进节点的
# .env.secrets。这里只放非敏感的那几个。
#
# 发信地址要先在邮件推送控制台建好、域名验过 SPF/DKIM。
cortex_mail_from: "noreply@mail.cloudcele.com"
cortex_mail_from_alias: "Cortex"
# 邮件推送没有深圳节点：只有 cn-hangzhou（dm.aliyuncs.com）与四个海外。
# 留空即用默认值
cortex_mail_endpoint: ""
cortex_mail_region: ""
