name: cortex

services:
  # ─── Postgres + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
      # 中文分词在 Rust 侧用 jieba-rs 完成，此处无需任何分词扩展
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── RustFS（S3 兼容对象存储）──────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: cortex-rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      # 开发环境单卷。四卷纠删码要求四块**独立物理盘**，
      # 开发机只有一块盘时那是假冗余，RustFS 也会检测到共享设备并拒绝启动。
      # 生产部署改为 /data/rustfs{0...3} 并挂到真实独立磁盘。
      RUSTFS_VOLUMES: /data
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cortexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cortex_dev_only}
      # strict = 每次写入落盘后才确认。「永不丢失」的前提，勿调为 relaxed
      RUSTFS_DURABILITY_MODE: strict
      # RustFS 无按桶的 CORS 接口，允许来源是服务级配置。
      # 开发环境放开，以便 Flutter Web 直接 presigned PUT。
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"      # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"  # 控制台
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pg_data:
  rustfs_data:
