name: cortex

# ─── 关于下面每一处 `${CORTEX_BIND_ADDR:-127.0.0.1}:` ────────────────────
#
# 端口默认只绑**回环**而不是 `0.0.0.0`，收掉的是**局域网**那一面：
# 一台开着 Wi-Fi 的开发机，原来是把带默认口令的 postgres 与对象存储
# 摆在整个网段面前。
#
# # 但它挡不住沙箱容器 —— 这条是实测出来的，别照字面信
#
# 原以为这一改顺带也把沙箱关在外面了。真机测下来**不成立**（Docker Desktop
# / Windows）：
#
#   沙箱内 → cortex-postgres:5432（DNS 名）        拒绝   ← 拓扑隔离生效
#   沙箱内 → host.docker.internal:15432（绑 0.0.0.0）可达
#   沙箱内 → host.docker.internal:15432（改绑 127.0.0.1 之后）**仍然可达**
#
# Docker Desktop 的端口转发跑在那台 Linux 虚拟机里，容器经
# `host.docker.internal` 到达的正是转发器这一侧，绑不绑回环都一样。
# 更难看的是同一次实测里它还连上了这台机器上**另一个项目**的 postgres
# 与对象存储 —— 那两个不归这份 compose 管，改这里也管不着。
#
# 唯一实测有效的是把沙箱网段设成 `internal: true`（容器里连默认路由都没有，
# `host.docker.internal` 解析得出、路由不过去，上面三条全部拒绝）。
# 代价是**内部网段上已发布端口失效**（同样实测过：宿主 curl 连不上），
# 而 cortexd 眼下正是靠已发布端口反代进容器的 —— 所以那一步要连着一个
# 双宿的中继容器一起做，记在 roadmap 的 B3。
#
# 在原生 Linux 上（生产就是）绑回环**确实**是一道边界：docker-proxy 绑的是
# 宿主 netns 的 127.0.0.1，容器经网桥网关 172.17.0.1 过来碰不到它。
# 这一条是推理不是实测 —— 这台机器上没有原生 Linux docker 可验。
# 而生产 `deploy/docker-compose.yml` 一个 `ports:` 都没有，本来就不暴露。
#
# 想从局域网另一台机器连，设 `CORTEX_BIND_ADDR=0.0.0.0`。
#
# **cortexd 自己的端口不在此列**：容器必须够得着它才能回调（记忆写入、
# 拉历史），那条路由被沙箱令牌收窄到 5 条白名单路由 —— 那是有意留的门。
services:
  egress:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.egress
    image: cortex/egress-proxy:dev
    container_name: cortex-egress
    profiles: [sandbox]
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [ALL]
    read_only: true
    environment:
      # ── 出网放行清单 ──
      #
      # 默认 `*` = **整张公网**。不是「不限制」：目标解析到内网地址时代理
      # 仍会拒（`private_net.rs`）。这一条是必须的 —— 代理与 postgres /
      # rustfs / cortexd 同在一张网上，是这张拓扑里唯一两边都通的点，
      # 放开域名不判 IP 等于给沙箱一条通往数据库的路。
      #
      # 早先默认是「只放行几个包管理源」。那份清单是**装依赖用的**，不是
      # **干活用的** —— 读一份文档、调一个 API、访问用户自己的服务全部被拒，
      # 而一个 curl 都不能用的 agent 会被直接弃用，那比稍微漏一点更糟。
      #
      # 要让沙箱够到某个**内网**地址，把它**指名道姓**写进来（通配不算）：
      #   CORTEX_EGRESS_ALLOW=*,my-internal-api.lan:8080
      #
      # 收紧回去也只要改这一行，比如只放包管理源：
      #   CORTEX_EGRESS_ALLOW=pypi.org,*.pypi.org,registry.npmjs.org,...
      CORTEX_EGRESS_ALLOW: ${CORTEX_EGRESS_ALLOW:-*}
      # 明确列黑的，deny 压过 allow
      CORTEX_EGRESS_DENY: ${CORTEX_EGRESS_DENY:-}
      RUST_LOG: ${CORTEX_EGRESS_LOG:-cortex_egress_proxy=info,warn}
    networks:
      - default
      - sandbox
    # 开发时 cortexd 跑在宿主进程里，沙箱回调它的地址是
    # `host.docker.internal:8080` —— 而现在**只有这个容器**够得着宿主，
    # 所以要由它来解析。
    #
    # 必须显式写 `host-gateway`：Docker Desktop 会自动注入一条同名记录，
    # 但那条指向一个 **IPv6** 地址，而普通网桥没开 IPv6 —— 实测的症状是
    # 「在放行清单里，但连不上：Network is unreachable」。
    # 原生 Linux 上则压根不会自动注入。两种情况这一行都补上了。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只 publish 反向中继那个口，出网代理（3128）**不 publish** ——
      # 它只该在 internal 网段里可见。绑回环：cortexd 在宿主上。
      - "127.0.0.1:${CORTEX_SANDBOX_RELAY_PORT:-3129}:3129"

networks:
  # 沙箱网段。`internal: true` 是这整套隔离的**唯一**有效手段 ——
  # 详见文件开头那段实测记录，以及 docs/sandbox.md 第八节。
  #
  # 名字与 `sandbox_runner.rs::NETWORK` 写死的那个必须一致：那边用
  # `network_mode` 直接按名字接，compose 的 `name:` 关掉了项目名前缀。
  sandbox:
    name: cortex-sandbox-net
    internal: true
  default:
    name: cortex_default

