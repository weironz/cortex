# ══════════════════════════════════════════════════════════
#  本地开发环境 —— **完整的云端形态**，跑在这一台机器上
#
#    just dev          # 编 Linux 二进制 + 起全部
#    just dev-restart  # 改完 Rust：重编 + 重启 cortexd（不重建镜像）
#    just dev-down
#
#  叠在 docker-compose.yml 之上：
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                   --profile dev --profile sandbox up -d
#
#  ── 与「宿主上跑 cortexd」那种开发方式的差别 ──────────────
#
#  以前的开发方式是 `just run`：cortexd 跑在宿主进程里，只有 postgres /
#  rustfs 在容器里。快，但它测的是一条**生产上不存在**的拓扑：
#
#  | | 宿主跑 cortexd（just run）| 这里（just dev）| 生产 |
#  |---|---|---|---|
#  | cortexd 位置 | 宿主进程 | 容器 | 容器 |
#  | `same_network` | false | **true** | true |
#  | 反代进沙箱 | 经 cortex-egress 中继 | **直连容器名** | 直连容器名 |
#  | 浏览器→API | 直连 :8080（要开 CORS）| **nginx 同源** | traefik 同源 |
#
#  中间那一列至今**没有任何真机覆盖** —— `SandboxAddr::Direct` 那条路
#  只有单测。这套环境的第一价值就是把它跑起来。
#
#  ── 为什么二进制是挂进来的，不是烧进镜像 ──────────────────
#
#  烧进镜像意味着改一行 Rust 就要重建一次镜像（分钟级，且每次都要把
#  整个源码送进 build context）。挂进来的话，`cargo build` 增量编译
#  （秒级）+ `docker restart` 就够了。
#
#  代价是**宿主编出来的东西用不了**：这台机器是 Windows，`cargo build`
#  产出的是 PE 格式的 `.exe`，Linux 容器里跑不了。所以 `just dev-build`
#  在一个 `rust:1.97.1-trixie` 容器里编，产物落进 named volume
#  `cortex_dev_bin`，运行容器再挂那个卷。
#
#  target 目录用 named volume 而不是 bind mount：Windows 的 bind mount
#  在几万个小文件上慢到不可用（增量编译会从秒级退化到分钟级）。
# ══════════════════════════════════════════════════════════

services:
  # ─── Cortex 自己的库 ──────────────────────────────────
  #
  # **与记忆服务那个 postgres 是两回事。** 那边存 facts / entities，
  # 这边存会话、消息、附件、同步流水。会话曾经也在那边，后果是
  # 「记忆服务挂了就没有产品」—— 见 crates/cortex-store 的文档。
  #
  # 端口 5452：这台机器上 5432 被别的项目占着、5442 是 Cormex 的。
  # 只绑回环。
  #
  # ⚠️ 服务名是 `cortexdb` 而**不是 `postgres`**，这一点不能改回去。
  #
  # Cormex 的 compose 里也有一个叫 `postgres` 的服务，而两个仓库的
  # `docker-compose.yml` 第一行都写着 `name: cortex`。同项目 + 同服务名的
  # 后果不是「两个容器」，是 **compose 认为它们是同一个，直接替换** ——
  # 2026-08-15 实测：在这边 `up -d postgres`，Cormex 的 postgres 容器当场
  # 消失（数据卷幸存，容器要从那边重起）。反过来也一样。
  #
  # 真正的修法在 Cormex 那侧（改成 `name: cormex`，它的容器全是 cormex-*
  # 前缀，本来就该那样）。在它改之前，这一侧靠**不重名**自保。
  cortexdb:
    image: postgres:17-alpine
    container_name: cortex-postgres-dev
    profiles: [dev]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORTEX_PG_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_PG_PASSWORD:-cortex}
      POSTGRES_DB: ${CORTEX_PG_DB:-cortex}
    ports:
      - "127.0.0.1:${CORTEX_PG_PORT:-5452}:5432"
    volumes:
      - cortex_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORTEX_PG_USER:-cortex}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── agent 编排 ───────────────────────────────────────
  #
  # 它是**唯一**碰 docker.sock 的服务。
  # 分流在 nginx 那一层：`/chat` 与 `/sandbox/*` 到这儿，其余到记忆服务。
  #
  # 与记忆服务的关系只有 HTTP —— 没有它的数据库、没有它的对象存储凭据，
  # 要钥匙走 `POST /delegated-tokens`，带的是用户自己那把 bearer。
  # 上面那个 `cortexdb` 是**自己的**库，两件事不要混。
  agentd:
    image: cortex/devruntime:latest
    container_name: cortex-agentd-dev
    profiles: [dev]
    restart: unless-stopped
    command: ["/opt/cortex/bin/cortex-agentd"]
    environment:
      CORTEX_AGENTD_BIND: 0.0.0.0:8081
      # 这个进程怎么找到记忆服务
      # 记忆服务**不在这个 compose 里**（它在 Cormex 仓库）。
      # 走宿主：Cormex 的 compose 把 8080 发布在宿主上
      CORTEX_MEMORY_URL: ${CORTEX_MEMORY_URL:-http://host.docker.internal:8080}
      # **容器**怎么找到记忆服务。与上面那条不是一回事，而这里曾经写错。
      #
      # 沙箱网段是 `internal: true`：容器**没有默认路由**，够不着宿主，
      # 于是 `host.docker.internal` 既解析不了也连不上。而唯一的出网口
      # （cortex-egress）会拒绝任何解析到内网的地址 —— 那是它该做的
      # （SSRF 防护），不是可以放宽的东西。
      #
      # 所以走生产那条路：**记忆服务上同一张 internal 网，按服务名直连**
      # （生产是 `http://cormex:8080` + 同网段，见 deploy/docker-compose.yml）。
      # dev 的差别只有名字：记忆服务在 Cormex 仓库那个 compose 里，
      # 容器名是 `cormex-cortexd`，由 `just dev` 把它接进这张网。
      #
      # 症状记一笔：写成 host.docker.internal 时，容器起得来、agentd 一切
      # 正常、`/sandbox/health` 报 memory_reachable=true（那是 **agentd**
      # 够得着，它不在 internal 网上），只有真发一轮对话才炸在
      # `/llm/stream` 上 —— 一个所有健康检查都说好的坏。
      CORTEX_SANDBOX_CALLBACK: ${CORTEX_SANDBOX_CALLBACK:-http://cormex-cortexd:8080}
      # 同网段直连，回调不经出网代理（它本来就该拒绝内网地址）
      CORTEX_SANDBOX_SAME_NETWORK: "1"
      # Cortex 自己的库。服务名直连 —— 与上面那个记忆服务的地址无关
      CORTEX_DATABASE_URL: >-
        postgres://${CORTEX_PG_USER:-cortex}:${CORTEX_PG_PASSWORD:-cortex}@cortexdb:5432/${CORTEX_PG_DB:-cortex}
      RUST_LOG: ${RUST_LOG:-cortex_agentd=debug,warn}
    volumes:
      - cortex_dev_bin:/opt/cortex/bin:ro
      # 起沙箱要 docker API。**这是把宿主 root 交给它** —— 容器规格全部写死
      # 在 DockerRunner 里，调用方说不出第二个挂载，那是这条论证的另一半
      - /var/run/docker.sock:/var/run/docker.sock
    # 同 cortexd：socket 是 root:root 660，而这个容器不跑 root
    group_add: ["0"]
    depends_on:
      cortexdb:
        condition: service_healthy
    networks:
      - default
      - sandbox

  # ─── Web ──────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: cortex-web-dev
    profiles: [dev]
    restart: unless-stopped
    depends_on: [agentd]
    volumes:
      # Flutter 的构建产物，宿主 bind mount。改完 `flutter build web`
      # 刷新浏览器就生效，不用碰容器
      - ./app/build/web:/usr/share/nginx/html:ro
      # 官方镜像会把 templates 里的 `${VAR}` envsubst 成 conf.d 下的同名文件
      - ./scripts/docker/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # 记忆服务的地址。见模板里那段 —— 它不是一个 compose 服务名了
      CORTEX_MEMORY_UPSTREAM: ${CORTEX_MEMORY_UPSTREAM:-host.docker.internal:8080}
    ports:
      - "127.0.0.1:${CORTEX_WEB_DEV_PORT:-5173}:80"
    networks:
      - default

volumes:
  # 容器里编出来的 Linux 二进制。宿主看不见它，也不该看见 ——
  # 宿主那份 `target/` 是 Windows 的，两者混在一起只会互相覆盖。
  #
  # **`name:` 必须显式写。** compose 默认给卷加项目名前缀，于是这里声明的
  # `cortex_dev_bin` 实际叫 `cortex_cortex_dev_bin`，而 `scripts/dev-build.sh`
  # 里那个 `docker run -v cortex_dev_bin:/out` 用的是裸名 —— 两个不同的卷。
  # 症状是容器起不来、报 `stat /opt/cortex/bin/cortexd: no such file`，
  # 而 `docker volume ls` 里明明看得见一个叫 cortex_dev_bin 的卷。实测撞过。
  #
  # target 与 cargo 缓存**不在这里声明**：它们只属于构建脚本，
  # compose 不该知道它们存在
  cortex_dev_bin:
    name: cortex_dev_bin

  # Cortex 自己那个库的数据。同样显式写 `name:`，理由同上 ——
  # 换个项目名就换一个卷，等于开发数据莫名其妙没了
  cortex_dev_pg:
    name: cortex_dev_pg
