# ══════════════════════════════════════════════════════════
#  本地开发环境 —— **完整的云端形态**，跑在这一台机器上
#
#    just dev          # 编 Linux 二进制 + 起全部
#    just dev-restart  # 改完 Rust：重编 + 重启 cortexd（不重建镜像）
#    just dev-down
#
#  叠在 docker-compose.yml 之上：
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                   --profile dev --profile sandbox up -d
#
#  ── 与「宿主上跑 cortexd」那种开发方式的差别 ──────────────
#
#  以前的开发方式是 `just run`：cortexd 跑在宿主进程里，只有 postgres /
#  rustfs 在容器里。快，但它测的是一条**生产上不存在**的拓扑：
#
#  | | 宿主跑 cortexd（just run）| 这里（just dev）| 生产 |
#  |---|---|---|---|
#  | cortexd 位置 | 宿主进程 | 容器 | 容器 |
#  | `same_network` | false | **true** | true |
#  | 反代进沙箱 | 经 cortex-egress 中继 | **直连容器名** | 直连容器名 |
#  | 浏览器→API | 直连 :8080（要开 CORS）| **nginx 同源** | traefik 同源 |
#
#  中间那一列至今**没有任何真机覆盖** —— `SandboxAddr::Direct` 那条路
#  只有单测。这套环境的第一价值就是把它跑起来。
#
#  ── 为什么二进制是挂进来的，不是烧进镜像 ──────────────────
#
#  烧进镜像意味着改一行 Rust 就要重建一次镜像（分钟级，且每次都要把
#  整个源码送进 build context）。挂进来的话，`cargo build` 增量编译
#  （秒级）+ `docker restart` 就够了。
#
#  代价是**宿主编出来的东西用不了**：这台机器是 Windows，`cargo build`
#  产出的是 PE 格式的 `.exe`，Linux 容器里跑不了。所以 `just dev-build`
#  在一个 `rust:1.97.1-trixie` 容器里编，产物落进 named volume
#  `cortex_dev_bin`，运行容器再挂那个卷。
#
#  target 目录用 named volume 而不是 bind mount：Windows 的 bind mount
#  在几万个小文件上慢到不可用（增量编译会从秒级退化到分钟级）。
# ══════════════════════════════════════════════════════════

services:
  # ─── Cortex 自己的库 ──────────────────────────────────
  #
  # **与记忆服务那个 postgres 是两回事。** 那边存 facts / entities，
  # 这边存会话、消息、附件、同步流水。会话曾经也在那边，后果是
  # 「记忆服务挂了就没有产品」—— 见 crates/cortex-store 的文档。
  #
  # 端口 5452：这台机器上 5432 被别的项目占着、5442 是 Cormex 的。
  # 只绑回环。
  #
  # ⚠️ 服务名是 `cortexdb` 而**不是 `postgres`**，这一点不能改回去。
  #
  # Cormex 的 compose 里也有一个叫 `postgres` 的服务，而两个仓库的
  # `docker-compose.yml` 第一行都写着 `name: cortex`。同项目 + 同服务名的
  # 后果不是「两个容器」，是 **compose 认为它们是同一个，直接替换** ——
  # 2026-08-15 实测：在这边 `up -d postgres`，Cormex 的 postgres 容器当场
  # 消失（数据卷幸存，容器要从那边重起）。反过来也一样。
  #
  # 真正的修法在 Cormex 那侧（改成 `name: cormex`，它的容器全是 cormex-*
  # 前缀，本来就该那样）。在它改之前，这一侧靠**不重名**自保。
  cortexdb:
    image: postgres:17-alpine
    container_name: cortex-postgres-dev
    profiles: [dev]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORTEX_PG_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_PG_PASSWORD:-cortex}
      POSTGRES_DB: ${CORTEX_PG_DB:-cortex}
    ports:
      - "127.0.0.1:${CORTEX_PG_PORT:-5452}:5432"
    # ── 归档配置与生产一致 ──────────────────────────────
    #
    # 开发机上不需要 PITR，但**需要能把备份链路真的跑一遍** —— 没有它，
    # `just backup` 停在 `archive_mode=off`，于是那条链路只有到生产上
    # 才第一次被执行，而那是最不该第一次执行的地方。
    #
    # 与 deploy/ 那份**逐条相同**（不是「差不多」）：备份脚本按归档布局
    # 恢复，两边不一致的话，本机演练绿而生产恢复失败。
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
      - -c
      - wal_compression=on
      - -c
      - summarize_wal=on
    volumes:
      - cortex_dev_pg:/var/lib/postgresql/data
      - ${CORTEX_BACKUP_DIR:-./data/backup}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORTEX_PG_USER:-cortex}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── agent 编排 ───────────────────────────────────────
  #
  # 它是**唯一**碰 docker.sock 的服务。
  # 分流在 nginx 那一层：`/chat` 与 `/sandbox/*` 到这儿，其余到记忆服务。
  #
  # 与记忆服务的关系只有 HTTP —— 没有它的数据库、没有它的对象存储凭据，
  # 要钥匙走 `POST /delegated-tokens`，带的是用户自己那把 bearer。
  # 上面那个 `cortexdb` 是**自己的**库，两件事不要混。
  agentd:
    image: cortex/devruntime:latest
    container_name: cortex-agentd-dev
    profiles: [dev]
    restart: unless-stopped
    command: ["/opt/cortex/bin/cortex-agentd"]
    environment:
      CORTEX_AGENTD_BIND: 0.0.0.0:8081
      # 这个进程怎么找到记忆服务
      # 记忆服务**不在这个 compose 里**（它在 Cormex 仓库）。
      # 走宿主：Cormex 的 compose 把 8080 发布在宿主上
      CORTEX_MEMORY_URL: ${CORTEX_MEMORY_URL:-http://host.docker.internal:8080}
      # **容器**怎么找到记忆服务。与上面那条不是一回事，而这里曾经写错。
      #
      # 沙箱网段是 `internal: true`：容器**没有默认路由**，够不着宿主，
      # 于是 `host.docker.internal` 既解析不了也连不上。而唯一的出网口
      # （cortex-egress）会拒绝任何解析到内网的地址 —— 那是它该做的
      # （SSRF 防护），不是可以放宽的东西。
      #
      # 所以走生产那条路：**记忆服务上同一张 internal 网，按服务名直连**
      # （生产是 `http://cormex:8080` + 同网段，见 deploy/docker-compose.yml）。
      # dev 的差别只有名字：记忆服务在 Cormex 仓库那个 compose 里，
      # 容器名是 `cormex-cortexd`，由 `just dev` 把它接进这张网。
      #
      # 症状记一笔：写成 host.docker.internal 时，容器起得来、agentd 一切
      # 正常、`/sandbox/health` 报 memory_reachable=true（那是 **agentd**
      # 够得着，它不在 internal 网上），只有真发一轮对话才炸在
      # `/llm/stream` 上 —— 一个所有健康检查都说好的坏。
      # **容器回调打 agentd 自己。**
      #
      # 以前指向记忆服务，因为 `/episodes` `/sessions` `/llm/stream` 都在那边。
      # 2026-08-16 它们全搬过来了，于是沙箱只需要**一个**回调地址、**一把**
      # 凭据（委托令牌也是这个进程签的），而记忆检索由 agentd 代理出去。
      #
      # 附带好处：不再要求记忆服务挂在沙箱那张 internal 网上 —— 那条约束
      # 曾经是 dev 与生产各写一套配置的根源，也是「所有健康检查都说好，
      # 只有真发一轮对话才炸」那个坑的来源。
      CORTEX_SANDBOX_CALLBACK: ${CORTEX_SANDBOX_CALLBACK:-http://agentd:8081}
      # 同网段直连，回调不经出网代理（它本来就该拒绝内网地址）
      # 反向中继地址。同网段（上面那行 =1）时用不上，所以两份 compose
      # 里都长期缺席 —— 直到那道闸问「代码读了它，你怎么设它」。
      # 留个口子的成本是一行；缺它的成本是 SAME_NETWORK=0 那种拓扑
      # 下没有任何办法改地址，而症状是沙箱起来了但回调打不通。
      CORTEX_SANDBOX_RELAY: ${CORTEX_SANDBOX_RELAY:-}
      CORTEX_SANDBOX_SAME_NETWORK: "1"
      # Cortex 自己的库。服务名直连 —— 与上面那个记忆服务的地址无关
      CORTEX_DATABASE_URL: >-
        postgres://${CORTEX_PG_USER:-cortex}:${CORTEX_PG_PASSWORD:-cortex}@cortexdb:5432/${CORTEX_PG_DB:-cortex}
      # ── 认证 ──
      #
      # 身份搬过来之后，**这个进程自己校验凭据**（以前是把 bearer 原样带给
      # 记忆服务，让它的回答当认证结果）。两边必须配同一把，否则症状是
      # 「登录成功但一发消息就 401」。
      #
      # 没配任何一项时 `AuthMode::from_env` **拒绝启动**，那是有意的：
      # 一个不认证的 agentd 会把所有人的会话交给任何连得上这个端口的人，
      # 而那件事没有任何症状。想关掉要显式写 CORTEX_AUTH=disabled。
      CORTEX_AUTH_TOKEN_SHA256: ${CORTEX_AUTH_TOKEN_SHA256:-}
      CORTEX_AUTH: ${CORTEX_AUTH:-}
      # 注册默认是**关**的（见 accounts.rs）。开放注册意味着任何人都能拿
      # 服务端那把 key 烧钱，而生产是一台 2 核 3.5G 的机器。
      # 取值必须正好是 `enabled`，手滑写成 1 不会把门打开。
      CORTEX_OPEN_REGISTRATION: ${CORTEX_OPEN_REGISTRATION:-}
      # 开发机免密登录：留空用户名与密码点「登录」，直接进成这个人。
      #
      # 值是**登成谁**而不是一个 `true`：布尔答不出「那我进去是谁」，
      # 实现只能编个幽灵用户或抓第一个账号，前者让租户解析失去意义、
      # 后者随建号顺序变。也因此它不可能手滑打开 —— `=1` 只会去找一个
      # 叫 `1` 的用户然后失败。
      #
      # **生产的 compose 里没有这一行**，加进去要过 code review。
      CORTEX_DEV_LOGIN: ${CORTEX_DEV_LOGIN:-admin}
      # ── 模型 ──
      #
      # `/llm/stream` 搬过来之后，**这个进程是花钱的那一方**：服务端那把 key
      # 在这儿，额度闸门也在这儿。配不全只 warn 不退出 —— 这个进程的本职是
      # 编排容器，不该因为一个模型设置起不来；`/llm/stream` 此时回 501，
      # 客户端把 501 当成「这条路不会开」而不重试。
      #
      # ⚠️ `${VAR:-}` 展开成**空串**，而 `env::var` 对空串返回 `Ok("")`。
      # 装配时会判一次「这把 key 是不是空的」，否则会造出一个看着活、
      # 每一轮都被供应商拒的客户端 —— 这个仓库在「空串顶掉默认值」上栽过。
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_LLM_CHEAP_MODEL: ${CORTEX_LLM_CHEAP_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 用户自带 key 的信封加密主密钥。**没有它就存不了自带 key**
      # （`/settings/llm-key` 明说不支持，而不是假装存下了）
      CORTEX_SECRET_KEY: ${CORTEX_SECRET_KEY:-}
      # 每人每月的 token 上限。0 = 不限
      # 第一个账号。**这是「只有 compose、没有 shell」的人唯一的建号入口** ——
      # 代码里 `ensure_admin` 从 0.1.10 起就在开始监听之前跑，而这两行
      # 直到 0.1.10 上线才被透进容器：在那之前它只存在于 `.env.example`
      # 和文档里，也就是那条路对它面向的人从来没通过。
      #
      # 只建号，**不改密码**：账号已存在时跳过。所以改口令要走别的路，
      # 而不是改这里再重启（那样什么都不会发生，且没有任何提示）。
      CORTEX_ADMIN_USERNAME: ${CORTEX_ADMIN_USERNAME:-}
      CORTEX_ADMIN_PASSWORD: ${CORTEX_ADMIN_PASSWORD:-}
      CORTEX_QUOTA_TOKENS_PER_MONTH: ${CORTEX_QUOTA_TOKENS_PER_MONTH:-}
      # ── 对象存储 ──
      #
      # 附件与快照的字节落在这儿。走**服务名** —— agentd 与 rustfs 同网段。
      #
      # ⚠️ **dev 上 32 MB 以上的附件传不了，这是已知的、没有假修的限制。**
      #
      # 客户端按大小分两条路（`app/lib/api/blob_upload.dart`）：
      # ≤32 MB 走 `POST /blobs` 由 agentd 中转（**这条在 dev 上是通的**）；
      # 更大的走 presign 直传 —— 而签名 URL 里带的就是这里这个 endpoint，
      # SigV4 把 Host 一起签了，浏览器解析不了 `rustfs` 这个名字。
      #
      # 没有「填一个公网地址」这种解法：agentd 与浏览器必须用**同一个**
      # 字符串，否则签名对不上。真要修得让边缘把 /s3 也代理掉，让两边同源
      # —— 那是一件独立的事，不在这儿凑合。
      # **写死服务名，不给 `.env` 覆盖的机会。** 与 `CORTEX_DATABASE_URL`
      # 同一个道理：这是「容器怎么找到它的邻居」，而 `.env` 里那一份是
      # 「宿主进程怎么找到它」。实测撞过：`.env` 里留着一个
      # `S3_ENDPOINT=http://localhost:9010`（cortexd 还跑在宿主上的年代），
      # 被 `${S3_ENDPOINT:-…}` 取走之后，容器里的 `localhost` 是它自己 ——
      # 报的是 Connection refused，看着像 rustfs 没起来
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-cortex-blobs}
      S3_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cortexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cortex_dev_only}
      RUST_LOG: ${RUST_LOG:-cortex_agentd=debug,warn}
    volumes:
      - cortex_dev_bin:/opt/cortex/bin:ro
      # 起沙箱要 docker API。**这是把宿主 root 交给它** —— 容器规格全部写死
      # 在 DockerRunner 里，调用方说不出第二个挂载，那是这条论证的另一半
      - /var/run/docker.sock:/var/run/docker.sock
    # 同 cortexd：socket 是 root:root 660，而这个容器不跑 root
    group_add: ["0"]
    depends_on:
      cortexdb:
        condition: service_healthy
    networks:
      - default
      - sandbox

  # ─── 对象存储 ──────────────────────────────────────────
  #
  # **这里存两样东西，而且只有这两样**：对话附件与工作区快照。
  # 判据是「要长期留着、跨设备可取」的字节。
  #
  # 它**不是 agent 的工作目录** —— 沙箱里那些文件在 docker 卷里
  # （`PUT /sandbox/files` 走 docker 的 archive API，从不碰这儿），
  # 随项目生死，agent 用文件工具直接读写，不该多一次上传下载。
  #
  # 以前这个服务在记忆服务那个 compose 里，因为附件表跟着库住在那边。
  # 表搬回来了，存字节的地方也得跟着回来 —— 否则 agentd 只能干看着
  # 一堆 blob 行、取不回字节。
  #
  # ⚠️ 容器名 `cortex-rustfs-dev`，与那边的 `cormex-rustfs` 不同名：
  # 同名会被 compose 认成同一个容器直接替换掉（同项目名 + 同服务名那个坑，
  # 见 `cortexdb` 上面那段）。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: cortex-rustfs-dev
    profiles: [dev]
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      # 开发机一块盘。四卷纠删码要**四块物理独立的盘**，单盘上那是假冗余，
      # 而 RustFS 自己会认出共享设备然后拒绝启动
      RUSTFS_VOLUMES: /data
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cortexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cortex_dev_only}
      # strict = 写入落盘之后才算成功。「不丢东西」的前提，别调低
      RUSTFS_DURABILITY_MODE: strict
      # RustFS 没有按桶的 CORS 接口，只能整个服务开。开发机放开是为了让
      # Flutter Web 能直接做 presigned PUT —— 大文件不经过 agentd 中转
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      # 9000 必须发布：Flutter Web 的直传是**浏览器**发起的，它在容器网络外面。
      # 端口挪开 9000/9001 —— 这台机器上别的项目占着（见 CLAUDE.md 那条）
      - "127.0.0.1:${CORTEX_RUSTFS_API_PORT:-9040}:9000"
      - "127.0.0.1:${CORTEX_RUSTFS_CONSOLE_PORT:-9041}:9001"
    volumes:
      - cortex_dev_rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Web ──────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: cortex-web-dev
    profiles: [dev]
    restart: unless-stopped
    depends_on: [agentd]
    volumes:
      # Flutter 的构建产物，宿主 bind mount。改完 `flutter build web`
      # 刷新浏览器就生效，不用碰容器
      - ./app/build/web:/usr/share/nginx/html:ro
      # 官方镜像会把 templates 里的 `${VAR}` envsubst 成 conf.d 下的同名文件
      - ./scripts/docker/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # 记忆服务的地址。见模板里那段 —— 它不是一个 compose 服务名了
      CORTEX_MEMORY_UPSTREAM: ${CORTEX_MEMORY_UPSTREAM:-host.docker.internal:8080}
    ports:
      - "127.0.0.1:${CORTEX_WEB_DEV_PORT:-5173}:80"
    networks:
      - default

volumes:
  # 容器里编出来的 Linux 二进制。宿主看不见它，也不该看见 ——
  # 宿主那份 `target/` 是 Windows 的，两者混在一起只会互相覆盖。
  #
  # **`name:` 必须显式写。** compose 默认给卷加项目名前缀，于是这里声明的
  # `cortex_dev_bin` 实际叫 `cortex_cortex_dev_bin`，而 `scripts/dev-build.sh`
  # 里那个 `docker run -v cortex_dev_bin:/out` 用的是裸名 —— 两个不同的卷。
  # 症状是容器起不来、报 `stat /opt/cortex/bin/cortexd: no such file`，
  # 而 `docker volume ls` 里明明看得见一个叫 cortex_dev_bin 的卷。实测撞过。
  #
  # target 与 cargo 缓存**不在这里声明**：它们只属于构建脚本，
  # compose 不该知道它们存在
  cortex_dev_bin:
    name: cortex_dev_bin

  # Cortex 自己那个库的数据。同样显式写 `name:`，理由同上 ——
