<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cortex 标识 · 皮层沟回（母版）

  两道嵌套的 C 形弧：既是皮层的沟回，也是名字的首字母。
  外弧用主色，内弧用**记忆专用强调色**（app/lib/core/theme.dart 里的
  memoryAccent）—— 记忆是这个产品的核心，所以它在标识的核心位置。

  几何是算出来的，不是拖出来的，改的时候照着这套数走：
    画布 1024，圆心 (512,512)
    外弧 r=358 stroke=116 → 环带 300..416，缺口半角 40°
    间隙 90（300-210）
    内弧 r=158 stroke=104 → 环带 106..210，缺口半角 52°
    中心留空 r=106

  缺口朝右，外弧 80°、内弧 104° —— 内弧开得更大一点，
  两道弧就不是同心圆环，而是一道向内收的折叠。

  ⚠ 这一版是给 **48px 以上**用的。16/24/32 用 cortex-mark-small.svg：
  三条带子缩到 16px 时每条不到 2px，会糊成一团。见那个文件的说明。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g fill="none" stroke-linecap="round">
    <path d="M 786.3 742.1 A 358 358 0 1 1 786.3 281.9"
          stroke="#5B62F4" stroke-width="116"/>
    <path d="M 609.3 636.5 A 158 158 0 1 1 609.3 387.5"
          stroke="#0E7C86" stroke-width="104"/>
  </g>
</svg>
