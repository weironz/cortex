<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cortex 标识 · 小尺寸变体（16 / 24 / 32 px）

  # 为什么要单独一版

  母版是三条同心带子（外环、间隙、内环）加中心留空。缩到 16px 时
  每条不到 2px，抗锯齿一糊就成了一个灰点 —— 而标签页和任务栏**只有**
  这个尺寸。多尺寸 .ico 与 favicon 本来就允许每档放不同的画，
  这是图标行业的常规做法，不是偷工减料。

  改动只有一处：内弧换成**实心圆点**，外弧加粗。
    外弧 r=340 stroke=150 → 环带 265..415，缺口半角 38°
    圆点 r=130
  16px 下：外环 2.3px、间隙 2.1px、圆点 4px —— 三层都还看得出来。

  形状语言与母版一致（一个 C，核心在中间），所以两档换手时不跳。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <path d="M 779.9 721.3 A 340 340 0 1 1 779.9 302.7"
        fill="none" stroke="#5B62F4" stroke-width="150" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="130" fill="#0E7C86"/>
</svg>
