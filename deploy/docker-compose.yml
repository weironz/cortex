# ══════════════════════════════════════════════════════════
#  Cortex 生产栈 —— 挂在**已存在的** traefik 后面
#
#  用法（在节点的 /data/cortex 下）：
#      docker compose --env-file .env up -d
#
#  ── 为什么是独立文件，不叠在 docker-compose.yml 上 ────────
#  compose 合并 `ports` 时是**追加**而不是替换。仓库里的
#  docker-compose.prod.yml 叠在开发那份上之后，`docker compose config`
#  实际吐出两条 5442 的映射：一条 0.0.0.0、一条 127.0.0.1 ——
#  也就是说那句「生产只绑回环」的注释并没有兑现。
#  这台机器上已经跑着 mica / neostor / headscale / rustdesk，
#  还有两个 postgres 与两个 rustfs，**任何一个多余的宿主端口都是一次撞车**，
#  所以这份文件从头写，一个 `ports:` 都没有。
#
#  数据面（postgres / rustfs 内网口）只在本 compose 网络里可达；
#  对外只经 traefik 出去两个域名。
#
#  ── DNS 是前置条件 ────────────────────────────────────────
#  ${DOMAIN} 与 ${S3_DOMAIN} 必须已经 A 记录指向本机，
#  否则 Let's Encrypt 的 HTTP-01 挑战过不了，证书签不下来。
#  验证：dig +short cortex.cloudcele.com
# ══════════════════════════════════════════════════════════

# 每个容器的日志都封顶。json-file 默认无上限，一个刷屏的服务
# （或者一个崩溃重启循环）就能把盘写满，把整台机器一起带走 ——
# 而这台机器上还有别人的四个服务。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  egress:
    image: ${CORTEX_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/cortex-egress-proxy:${CORTEX_VERSION:?由部署脚本写入，形如 v0.1.0}
    container_name: cortex-egress
    profiles: [sandbox]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [ALL]
    read_only: true
    environment:
      # ── 出网放行清单 ──
      #
      # 默认 `*` = **整张公网**。不是「不限制」：目标解析到内网地址时代理
      # 仍会拒（`private_net.rs`）。这一条是必须的 —— 代理与 postgres /
      # rustfs / cortexd 同在一张网上，是这张拓扑里唯一两边都通的点，
      # 放开域名不判 IP 等于给沙箱一条通往数据库的路。
      #
      # 早先默认是「只放行几个包管理源」。那份清单是**装依赖用的**，不是
      # **干活用的** —— 读一份文档、调一个 API、访问用户自己的服务全部被拒，
      # 而一个 curl 都不能用的 agent 会被直接弃用，那比稍微漏一点更糟。
      #
      # 要让沙箱够到某个**内网**地址，把它**指名道姓**写进来（通配不算）：
      #   CORTEX_EGRESS_ALLOW=*,my-internal-api.lan:8080
      #
      # 收紧回去也只要改这一行，比如只放包管理源：
      #   CORTEX_EGRESS_ALLOW=pypi.org,*.pypi.org,registry.npmjs.org,...
      CORTEX_EGRESS_ALLOW: ${CORTEX_EGRESS_ALLOW:-*}
      # 明确列黑的，deny 压过 allow
      CORTEX_EGRESS_DENY: ${CORTEX_EGRESS_DENY:-}
      RUST_LOG: ${CORTEX_EGRESS_LOG:-cortex_egress_proxy=info,warn}
    networks:
      - default
      - sandbox
    deploy:
      resources:
        limits:
          # 它只做字节转发，常驻是个位数 MB。封顶是为了「一个连接泄漏
          # 不会拖垮别人」，不是为了省内存
          cpus: ${CORTEX_EGRESS_CPU_LIMIT:-0.5}
          memory: ${CORTEX_EGRESS_MEM_LIMIT:-128m}

  # ── 记忆服务（Cormex）**不在这份文件里** ────────────────
  #
  # 它是另一个产品（github.com/weironz/cormex），有自己的仓库、自己的镜像、
  # 自己的版本线，部署在这台机器的 `/data/cormex` 那一栈里。
  #
  # 这里以前有过一段它的服务定义与 `CORMEX_VERSION` / `CORMEX_IMAGE` 的说明。
  # 服务搬走了，那段注释留在了原地 —— 于是它描述的东西整份文件里一个都没有，
  # 而下一个人会照着它去 .env 里配那两个变量，然后发现毫无作用。删掉。
  #
  # 现在两者之间只有下面 agentd 环境里的两个地址：
  #   CORTEX_MEMORY_URL       这个进程怎么找到它
  #   CORTEX_SANDBOX_CALLBACK 沙箱容器怎么找到它
  # 默认值 `http://cormex:8080` 成立的前提是**那一栈与这一栈接在同一张网上**
  # （部署脚本负责），不成立就在 .env 里覆盖成能通的地址。

  # ─── Cortex 自己的库 ──────────────────────────────────
  #
  # 装的是**会话**：消息、附件、项目、同步流水、沙箱快照、自带 API key。
  # 这些曾经住在记忆服务的库里，后果是停掉它之后 agent 连上一句话都读不到
  # （2026-08-15 实测）。判据一句话：**这张表离开记忆能力还有没有意义**。
  #
  # 与记忆服务那个 postgres 是**两套**。它在 /data/cormex 那一栈，带 pgvector；
  # 这一套一列向量都没有，用官方镜像即可。
  #
  # ⚠️ 服务名是 `cortexdb` 而不是 `postgres`：两个仓库的 compose 第一行都写着
  # `name: cortex`，同项目 + 同服务名会让 compose 认为是同一个服务并**直接替换
  # 对方的容器**。开发机上实测撞过，生产上撞一次就是记忆库容器没了。
  cortexdb:
    image: postgres:17-alpine
    container_name: cortex-db
    restart: unless-stopped
    logging: *default-logging
    # **只上 default**：agentd 从那儿连它。不上 traefik（不该有对外入口），
    # 也不上 sandbox（沙箱永远不该看见数据库 —— 那张网 internal 的全部意义）
    networks: [default]
    environment:
      POSTGRES_USER: ${CORTEX_PG_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_PG_PASSWORD:?部署脚本必须写入，不许留默认口令}
      POSTGRES_DB: ${CORTEX_PG_DB:-cortex}
    # 这台节点 2 核 3.5G，上面还跑着 mica / neostor / headscale / rustdesk
    # 与记忆服务那一栈（含它自己的 postgres）。默认参数是按独占机器调的，
    # 照搬会让两个 postgres 各自申请一大块共享内存。
    #
    # 128MB shared_buffers + 40 连接是按「单机自托管、几个人用」定的；
    # 真到了要调的时候，先量 `pg_stat_activity` 再动，别凭感觉加。
    # ── WAL 归档：没有它，`just backup` 只是「每天一个快照」 ──────
    #
    # 拆分时这一整组跟着老的 base compose 去了 Cormex，而**这一侧的库一条
    # 都没留下** —— 于是 `just backup` 就算把容器名指对了，也会停在
    # `archive_mode=off`。「RPO 46.9 秒」那个数字属于记忆那半的库，
    # 这一侧（会话/消息/附件）此前的真实 RPO 是**一次全量到下一次全量**。
    #
    # `archive_mode` 只能在启动时设，所以写在 command 里而不是 SQL。
    #   archive_timeout=60   没有写入也每 60 秒强制切段 —— **RPO 的上界就是它**
    #   archive_command      目标已存在就失败（绝不静默覆盖），
    #                        **且先写 .tmp 再原子改名** —— 见紧接着那段
    #   summarize_wal=on     PG17 的 WAL summarizer，`pg_basebackup --incremental` 的前置
    #   wal_compression=on   这台机器磁盘比 CPU 紧张
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - archive_mode=on
      - -c
      # ⚠️ **`cp` 到 .tmp 再 `mv`，不要直接 cp 到最终名字。**
      #
      # 2026-08-25 在开发机上实测踩到：一次被打断的 `cp`（容器被杀、宿主
      # 重启、盘满）留下一个 4 MB 的半截段，而 `test ! -f` 看见「文件在」
      # 就拒绝覆盖 —— 于是**归档永久卡在那一段**，后面的一段都出不去。
      #
      # 代价不是「少了一段」，是三件事一起发生：
      #   1. PITR 从那一刻起就断了（归档不再前进）；
      #   2. **活库的 pg_wal 无限涨** —— 没归档成功的段 postgres 不能回收。
      #      那台开发机上堆到了 17 GB / 1096 段，还在涨；
      #   3. 日志里只有一行 `archive command failed with exit code 1`，
      #      读起来像权限或盘满，而真正的原因是「有个半截文件挡着」。
      #
      # `mv` 在同一个文件系统上是原子的，所以最终名字要么不存在、要么是
      # 完整的一段。被打断留下的 `.tmp` 下一次会被直接覆盖。
      - archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f.tmp && mv /backup/wal/%f.tmp /backup/wal/%f
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
      - -c
      - wal_compression=on
      - -c
      - summarize_wal=on
      # ── 放行来自本网段的复制连接 ────────────────────────────────
      #
      # 备份容器的 `pg_basebackup` 开的是一条**复制连接**，而 initdb 生成的
      # 那份 pg_hba 只对 127.0.0.1 放行复制；官方入口脚本追加的那行
      # `host all all all scram-sha-256` 里的 `all` **按 pg_hba 的语义不匹配
      # replication** —— 这不是笔误，是规定。
      #
      # 没有这一条的症状是「no pg_hba.conf entry for replication connection」，
      # 而它只在备份真跑起来时出现，也就是凌晨三点、没人看着的时候。
      # 2026-08-25 起 hba_file 指到下面那份内联 config。
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    configs:
      - source: cortex-pg-hba
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - cortex-db-data:/var/lib/postgresql/data
      # 备份根。`archive_command` 往这儿写，`pg_basebackup` 也往这儿写 ——
      # 两者必须落在**同一个**挂载点上，否则恢复时 WAL 与全量对不上。
      # 宿主侧路径由 CORTEX_BACKUP_DIR 决定，见 scripts/lib.sh
      - ${CORTEX_BACKUP_DIR:-/data/cortex/backup}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORTEX_PG_USER:-cortex}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "${CORTEX_PG_CPU_LIMIT:-0.5}"
          memory: ${CORTEX_PG_MEM_LIMIT:-384m}

  agentd:
    image: ${CORTEX_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/cortex-agentd:${CORTEX_VERSION:?由部署脚本写入，形如 v0.1.0}
    container_name: cortex-agentd
    restart: unless-stopped
    logging: *default-logging
    # 与 cortexd 同样接三张网：traefik 进得来、sandbox 直连容器名、
    # default 提供出网（多网络时默认路由来自非 internal 的那张）
    networks: [default, traefik, sandbox]
    environment:
      CORTEX_AGENTD_BIND: 0.0.0.0:8081
      # 这个进程怎么找到记忆服务。同一台机器上走 compose 网络里的服务名。
      #
      # **有默认值是因为这份 compose 就把两者放在一起。** 换成外部记忆服务
      # 时在 .env 里覆盖它。
      #
      # ⚠️ 配错了**不再看得见**：长期记忆 2026-08-17 整条拆掉之后 agentd 不再
      # 连记忆服务，`/health` 里那个 `memory_reachable` 也删了。这个变量今天
      # 只剩边缘转给 Cormex 的 `/memory` `/mcp` 那条路在用（给第三方 agent），
      # 而那条路的健康归 Cormex 自己的 /health 管。
      CORTEX_MEMORY_URL: ${CORTEX_MEMORY_URL:-http://cormex:8080}
      # **容器**怎么找到记忆服务。沙箱网段是 internal 的，与 agentd 同网段，
      # 所以这里直连服务名，中继那一整层不参与
      # **容器回调打 agentd 自己。**
      #
      # 以前指向记忆服务，因为 `/episodes` `/sessions` `/llm/stream` 都在那边。
      # 2026-08-16 它们全搬过来了，于是沙箱只需要**一个**回调地址、**一把**
      # 凭据（委托令牌也是这个进程签的），而记忆检索由 agentd 代理出去。
      #
      # 附带好处：不再要求记忆服务挂在沙箱那张 internal 网上 —— 那条约束
      # 曾经是 dev 与生产各写一套配置的根源，也是「所有健康检查都说好，
      # 只有真发一轮对话才炸」那个坑的来源。
      CORTEX_SANDBOX_CALLBACK: ${CORTEX_SANDBOX_CALLBACK:-http://agentd:8081}
      # 反向中继地址。同网段（上面那行 =1）时用不上，所以两份 compose
      # 里都长期缺席 —— 直到那道闸问「代码读了它，你怎么设它」。
      # 留个口子的成本是一行；缺它的成本是 SAME_NETWORK=0 那种拓扑
      # 下没有任何办法改地址，而症状是沙箱起来了但回调打不通。
      CORTEX_SANDBOX_RELAY: ${CORTEX_SANDBOX_RELAY:-}
      CORTEX_SANDBOX_SAME_NETWORK: "1"
      # 沙箱镜像来自 registry，不是开发机上那个 `cortex/sandbox:dev`。
      # **漏了这一条不会启动失败**，只会在日志里印着 dev 那个名字，
      # 然后第一次真要起沙箱时报「镜像不在本地」—— 上线当天就是这么发现的
      # 整条引用可用 `CORTEX_SANDBOX_IMAGE` 覆盖。默认跟着 CORTEX_VERSION 走，
      # 但沙箱镜像与 agentd **不必同版本**：它是执行环境的模板，改动频率低得多。
      # 上线当天用到了这条口子 —— 沙箱镜像那个构建 job 红了，而 agentd 的
      # preflight 拉不到镜像就拒绝启动，于是整个 agent 服务起不来。
      # 指回上一个可用的 tag 就能先恢复服务。
      CORTEX_SANDBOX_IMAGE: ${CORTEX_SANDBOX_IMAGE:-${CORTEX_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/cortex-sandbox:${CORTEX_VERSION}}
      CORTEX_SANDBOX_ENABLED: ${CORTEX_SANDBOX_ENABLED:-0}
      # Cortex 自己的库。与上面那两条记忆服务的地址**没有关系** ——
      # 那边是「问它记忆」，这边是「我自己的会话存哪」。
      #
      # 连不上就拒绝启动（不静默降级）：cortexd 曾经在连不上数据库时悄悄
      # 回落到 mock 并照报 status: ok，症状是「服务活着但数据全是假的」。
      CORTEX_DATABASE_URL: >-
        postgres://${CORTEX_PG_USER:-cortex}:${CORTEX_PG_PASSWORD:?部署脚本必须写入}@cortexdb:5432/${CORTEX_PG_DB:-cortex}
      # ── 认证 ──
      #
      # 身份搬过来之后，**这个进程自己校验凭据**（以前是把 bearer 原样带给
      # 记忆服务，让它的回答当认证结果）。两边必须配同一把，否则症状是
      # 「登录成功但一发消息就 401」。
      #
      # 没配任何一项时 `AuthMode::from_env` **拒绝启动**，那是有意的：
      # 一个不认证的 agentd 会把所有人的会话交给任何连得上这个端口的人，
      # 而那件事没有任何症状。想关掉要显式写 CORTEX_AUTH=disabled。
      CORTEX_AUTH_TOKEN_SHA256: ${CORTEX_AUTH_TOKEN_SHA256:-}
      CORTEX_AUTH: ${CORTEX_AUTH:-}
      # 注册默认是**关**的（见 accounts.rs）。开放注册意味着任何人都能拿
      # 服务端那把 key 烧钱，而生产是一台 2 核 3.5G 的机器。
      # 取值必须正好是 `enabled`，手滑写成 1 不会把门打开。
      CORTEX_OPEN_REGISTRATION: ${CORTEX_OPEN_REGISTRATION:-}
      # ── 模型 ──
      #
      # `/llm/stream` 搬过来之后，**这个进程是花钱的那一方**：服务端那把 key
      # 在这儿，额度闸门也在这儿。配不全只 warn 不退出 —— 这个进程的本职是
      # 编排容器，不该因为一个模型设置起不来；`/llm/stream` 此时回 501，
      # 客户端把 501 当成「这条路不会开」而不重试。
      #
      # ⚠️ `${VAR:-}` 展开成**空串**，而 `env::var` 对空串返回 `Ok("")`。
      # 装配时会判一次「这把 key 是不是空的」，否则会造出一个看着活、
      # 每一轮都被供应商拒的客户端 —— 这个仓库在「空串顶掉默认值」上栽过。
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_LLM_CHEAP_MODEL: ${CORTEX_LLM_CHEAP_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 联网检索。空 = 这个部署没有 web_search 工具（它整个不进目录）
      CORTEX_SEARCH_API_KEY: ${CORTEX_SEARCH_API_KEY:-}
      CORTEX_SEARCH_BASE_URL: ${CORTEX_SEARCH_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 用户自带 key 的信封加密主密钥。**没有它就存不了自带 key**
      # （`/settings/llm-key` 明说不支持，而不是假装存下了）
      CORTEX_SECRET_KEY: ${CORTEX_SECRET_KEY:-}
      # 每人每月的 token 上限。0 = 不限
      # 第一个账号。**这是「只有 compose、没有 shell」的人唯一的建号入口** ——
      # 代码里 `ensure_admin` 从 0.1.10 起就在开始监听之前跑，而这两行
      # 直到 0.1.10 上线才被透进容器：在那之前它只存在于 `.env.example`
      # 和文档里，也就是那条路对它面向的人从来没通过。
      #
      # 只建号，**不改密码**：账号已存在时跳过。所以改口令要走别的路，
      # 而不是改这里再重启（那样什么都不会发生，且没有任何提示）。
      CORTEX_ADMIN_USERNAME: ${CORTEX_ADMIN_USERNAME:-}
      CORTEX_ADMIN_PASSWORD: ${CORTEX_ADMIN_PASSWORD:-}
      CORTEX_QUOTA_TOKENS_PER_MONTH: ${CORTEX_QUOTA_TOKENS_PER_MONTH:-}
      # 价目表（元/百万 token）与货币。不设就用内置那张小表 ——
      # 没有价目的模型在界面上显示「没有价目」，不是 ¥0.00
      CORTEX_MODEL_PRICES: ${CORTEX_MODEL_PRICES:-}
      CORTEX_PRICE_CURRENCY: ${CORTEX_PRICE_CURRENCY:-}
      # 美元→显示货币的汇率。**不配就整个用美元显示** ——
      # 模型目录里的价目是美元，随手挑一个汇率折出来的金额，
      # 用户没法判断对不对，也不知道该按哪天的汇率复核
      CORTEX_USD_RATE: ${CORTEX_USD_RATE:-}
      # 对象存储：附件的字节落在这里。
      #
      # **这几行 0.1.10 之前一直不在**，于是生产上的 `/api/sandbox/health`
      # 一直答 `blobs: disabled` —— 附件功能从 agentd 接手起就没通过，而它
      # 不报错，只是上传时说「这个部署没有接对象存储」。
      #
      # ⚠️ 端点写 `cortex-rustfs` 而不是 `rustfs`：rustfs 那个容器在
      # traefik-network 上同时叫这两个名字，而 **mica 的那台也叫 `rustfs`**
      # —— 在那张网上按 `rustfs` 解析等于抛硬币，一半的时候把附件写进
      # 别的产品的桶里。用带前缀的那个别名，它是唯一的。
      #
      # 走 traefik-network 是因为那是 agentd 与它唯一共有的网络：rustfs
      # 属于 cormex 那个 compose 项目（它先于拆分存在），不在 cortex_default 上。
      S3_ENDPOINT: ${S3_ENDPOINT:-http://cortex-rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      # 分享链接的基地址。**正常不配** —— `public_base` 从
      # `X-Forwarded-Proto` / `X-Forwarded-Host` / `X-Forwarded-Prefix` 推，
      # 而 traefik 三个头都设，推出来的比写死的准（写死会在换域名时静默作废）。
      #
      # 留这个口子是给**反代不设这些头**的部署兜底：那种部署拼出来的是
      # `http://127.0.0.1/s/...`，用户复制出去、对方打不开，而他不会怀疑到
      # 这一步 —— 症状离原因太远，所以要有一条能一行改掉的路。
      #
      # ⚠️ 空串是安全的：`public_base` 判了 `is_empty()` 才回落到头，
      # 不像这个仓库栽过的那些「空串顶掉默认值」。
      CORTEX_PUBLIC_URL: ${CORTEX_PUBLIC_URL:-}
      RUST_LOG: ${AGENTD_LOG:-cortex_agentd=info,warn}
    volumes:
      # 起沙箱要 docker API。**这是把宿主 root 交给它** —— 论证的另一半是
      # 容器规格全部写死在 DockerRunner 里，调用方说不出第二个挂载。
      # 这个能力现在**只在这一个容器上** —— 记忆服务那边的 docker.sock
      # 与整套沙箱配置已经一并撤掉了（它早就不读那些变量，权限却还留着）
      - ${CORTEX_DOCKER_SOCK:-/dev/null}:/var/run/docker.sock
    # ★ **那个组的 gid 因发行版而异，必须自己查**：`stat -c %g /var/run/docker.sock`
    #
    #   这台节点是 126，Docker Desktop 上是 0，Ubuntu 常见 999。
    #   搬迁时这里被写死成了 `["0"]`，于是 agentd 在节点上起来就是
    #   `client error (Connect)` 然后 restart 循环 —— 而那条错误读起来
    #   像「docker 没起来」，实际是「进程不在那个组里」。
    #   加的是**组**不是用户：进程仍然不是 root。
    group_add: ["${CORTEX_DOCKER_GID:-0}"]
    # 库先起来再起 agentd：agentd 连不上就退出，而 restart: unless-stopped
    # 会让它在 postgres 还在初始化的那十几秒里反复重启刷日志
    depends_on:
      cortexdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${AGENTD_CPU_LIMIT:-1.0}"
          memory: ${AGENTD_MEM_LIMIT:-512m}
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      # ── /api 归 agentd，**记忆那几条除外** ───────────────
      #
      # 与 cortex-api 同一个 `/api` 前缀、同一次 StripPrefix。
      # **优先级必须高于 cortex-api**（那条是 100，定义在 Cormex 那一栈里）：
      # 两条规则都匹配，traefik 按优先级选，写死免得靠「规则更长」这种会随
      # 改动漂移的东西。
      #
      # ⚠️ **这条规则以前是「只有 /api/chat 与 /api/sandbox 给 agentd」。**
      # 0.1.10 把身份、会话、项目、同步、附件、导入、模型代理全搬了过来，
      # 而这一行没跟着改 —— 于是线上除了聊天与沙箱，**整个应用都在打记忆
      # 服务**：登录页填对用户名口令，回来的是记忆服务的一句英文
      # 「this deployment has no database attached」，读起来像数据库没接上。
      #
      # 上线当天的验证没看出来，因为它查的是 `/api/sandbox/health` ——
      # 恰好是当时唯二转给 agentd 的两条之一。「验证走的不是用户那条路」。
      #
      # 所以这次反过来写：**默认给 agentd，把记忆那一侧指名让出去**。
      # 让出去的名单短且稳定（`routes.rs` 里有测试钉着它只有召回与 MCP），
      # 而 agentd 的路由表还会长 —— 一份会长的清单不该由边缘维护。
      #
      # `/api/health` 也让出去：它历来是记忆服务在答，部署验证断言的
      # `database` / `blob_backend` 都是它的字段。agentd 自己那条从公网
      # 走 `/api/sandbox/health`（见 deploy.yml 里那段注释）。
      traefik.http.routers.cortex-agent.rule: >-
        Host(`${DOMAIN}`) && PathPrefix(`/api`)
        && !PathPrefix(`/api/memory`)
        && !PathPrefix(`/api/mcp`)
        && !Path(`/api/health`)
      traefik.http.routers.cortex-agent.entrypoints: websecure
      traefik.http.routers.cortex-agent.tls: "true"
      traefik.http.routers.cortex-agent.tls.certresolver: letsencrypt
      traefik.http.routers.cortex-agent.priority: "200"
      # ★ **自带一份 stripprefix，不共用记忆服务那一份。**
      #   拆栈之前两条路由共用 `cortex-api-strip`，而那个 middleware 定义在
      #   记忆服务的容器标签上 —— 跨栈之后它一停，traefik 就丢掉这个
      #   middleware，agent 这条路由跟着废。两个栈各自定义各自的，名字不同。
      traefik.http.routers.cortex-agent.middlewares: cortex-agent-strip
      traefik.http.middlewares.cortex-agent-strip.stripprefix.prefixes: /api
      traefik.http.services.cortex-agent.loadbalancer.server.port: "8081"

  # ── Flutter Web ───────────────────────────────────────
  #
  # 这个镜像里的 API 地址是**编译期钉死**的
  # （见 scripts/docker/Dockerfile.web 里那段长注释：
  #  客户端只接受绝对地址，相对路径 /api 会被拼成 http:///api）。
  # 所以镜像与域名是绑定的 —— 换域名要重新构建镜像，不是改 .env
  web:
    image: ${CORTEX_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/cortex-web:${CORTEX_VERSION:?由部署脚本写入，形如 v0.1.0}
    container_name: cortex-web
    restart: unless-stopped
    logging: *default-logging
    networks: [default, traefik]
    # **不 depends_on 记忆服务**：它在另一个 compose 栈里（/data/cormex），
    # 跨栈的启动顺序 compose 表达不了，而且也不该表达 —— 那正是拆开要消掉的
    # 黏连。Web 是静态资源，起得比谁都早也没关系：它请求 /api 时若记忆服务
    # 还没就绪，界面会显示「连不上」并重试，而不是白屏。
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.cortex-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.cortex-web.entrypoints: websecure
      traefik.http.routers.cortex-web.tls: "true"
      traefik.http.routers.cortex-web.tls.certresolver: letsencrypt
      traefik.http.routers.cortex-web.priority: "1"
      traefik.http.services.cortex-web.loadbalancer.server.port: "80"

  # ══════════════════════════════════════════════════════════════════════
  #  备份 —— rustic 备 Postgres，rclone 备 RustFS，都推到阿里云 OSS
  # ══════════════════════════════════════════════════════════════════════
  #
  # 完整说明见 docs/backup.md。这里只写「为什么是这个形状」：
  #
  # **opt-in（`profiles: [backup]`）。** 裸 `docker compose up -d` 不会拉起
  # 它 —— 没配 OSS 凭据的部署（开发机、别人自托管的一份）拉起来只会每天
  # 失败一次，而那种噪音会让人学会忽略备份告警。
  #
  # **只上 default 与 traefik 两张网，绝不上 sandbox。** default 通 cortexdb
  # （pg_basebackup 从那儿拉），traefik 通 cortex-rustfs（rclone 从那儿读
  # blobs）—— 与 agentd 走同一条理由，见它那段。沙箱网是 internal 的，
  # 而且沙箱永远不该看见数据库或备份凭据。
  #
  # **挂的是备份根，不是数据卷。** 它读 `/backup/wal`（postgres 的
  # archive_command 往那儿写）、写 `/backup/base`。**不挂 cortex-db-data**：
  # 备份进程没有任何理由能碰到活着的数据目录。
  backup:
    image: ${CORTEX_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/cortex-backup:${CORTEX_VERSION:?由部署脚本写入，形如 v0.1.0}
    container_name: cortex-backup
    profiles: [backup]
    restart: unless-stopped
    logging: *default-logging
    networks: [default, traefik]
    depends_on:
      cortexdb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # ── 源：这一侧的库 ──
      CORTEX_PG_HOST: cortexdb
      CORTEX_PG_USER: ${CORTEX_PG_USER:-cortex}
      CORTEX_PG_PASSWORD: ${CORTEX_PG_PASSWORD:?部署脚本必须写入，不许留默认口令}
      CORTEX_PG_DB: ${CORTEX_PG_DB:-cortex}
      # ── 源：RustFS（blobs）──
      #
      # ⚠️ 端点写 `cortex-rustfs` 而不是 `rustfs` —— 与 agentd 那段同一个
      # 理由：traefik-network 上 mica 的那台也叫 `rustfs`，按短名解析等于
      # 抛硬币，一半的时候备的是别人的桶
      S3_ENDPOINT: ${S3_ENDPOINT:-http://cortex-rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-cortex-blobs}
      S3_REGION: ${S3_REGION:-us-east-1}
      # ⚠️ 名字用 RUSTFS_* 而不是另起一套 S3_* —— agentd 那侧读的就是
      # 这两个（见上面 296 行附近）。同一把凭据两个名字的话，改一处就是
      # 「附件能存但备不了」，而那件事没有任何症状
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?rclone 要读 RustFS，与 agentd 用同一把}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?rclone 要读 RustFS，与 agentd 用同一把}
      # ── 目标：阿里云 OSS ──
      #
      # ⚠️ **这把 key 必须与上面那把 S3_* 是两把不同的。** 用同一把的话，
      # 一次泄露同时拿到主存储与备份，而备份存在的全部意义正是
      # 「主存储出事时它还在」。
      # （「只授一个桶的 RAM 子账号」这一条明知代价地没做，理由见 docs/backup.md）
      OSS_BUCKET: ${OSS_BUCKET:?见 docs/backup.md}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?见 docs/backup.md}
      # ⚠️ 默认值跟着**实际那个桶**走（深圳），不是随手写一个杭州。
      # 有默认值的变量漏配时是**静默**回落 —— 回落到一个错的地域，
      # 症状是签名校验失败或者一句读不懂的 endpoint 错误
      OSS_REGION: ${OSS_REGION:-oss-cn-shenzhen}
      # 桶里的顶层前缀。下面再分两个：`<root>/pg`（rustic 仓库）与
      # `<root>/rustfs`（blobs 镜像）—— 为什么分见 render-config.sh。
      # 与别的项目共用一个桶时给自己换一个 root
      OSS_ROOT: ${OSS_ROOT:-cortex}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?见 docs/backup.md}
      OSS_SECRET_ACCESS_KEY: ${OSS_SECRET_ACCESS_KEY:?见 docs/backup.md}
      # ⚠️ **丢了它就等于丢了整个仓库。** rustic 的加密口令，
      # 存一份在这台机器之外
      CORTEX_BACKUP_PASSWORD: ${CORTEX_BACKUP_PASSWORD:?丢了它整个备份仓库就打不开了}
      # ── 节奏与保留 ──
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-6}
      CORTEX_BACKUP_CHECK_DOW: ${CORTEX_BACKUP_CHECK_DOW:-7}
      # 死人开关：成功 ping URL，失败 ping URL/fail。**不配就没有** ——
      # 它覆盖的是「压根没跑」，而那一类不产生任何退出码
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      - ${CORTEX_BACKUP_DIR:-/data/cortex/backup}:/backup
    # 2 核机器上还跑着别人的四个服务。备份是后台活儿，让它慢没关系，
    # 让它把机器占满不行
    deploy:
      resources:
        limits:
          cpus: "${CORTEX_BACKUP_CPU_LIMIT:-0.75}"
          memory: ${CORTEX_BACKUP_MEM_LIMIT:-512M}

configs:
  # Postgres 的 pg_hba，**内联**而不是一个要单独送上去的文件。
  #
  # ansible 往节点上只 copy 一份 docker-compose.yml（见 deploy.yml）——
  # 多一个文件就多一个「忘了送」的形状，而那种漏送的症状是容器起不来，
  # 发生在部署的最后一步。写在这里，它跟着 compose 一起走。
  #
  # `include` 那一行把 initdb 生成的、以及官方入口脚本追加的那份原样带进来
  # （PG16+ 支持）—— 于是我们只**加**一条规则，不接管整份文件。
  # 接管整份的代价是镜像哪天改了默认，我们这份不会跟着变。
  cortex-pg-hba:
    content: |
      include /var/lib/postgresql/data/pg_hba.conf
      host replication ${CORTEX_PG_USER:-cortex} all scram-sha-256

networks:
  traefik:
    external: true
    name: traefik-network

  # 沙箱网段。`internal: true` 是这整套隔离**唯一**有效的手段 ——
  # 真机实测过（docs/sandbox.md 第八节）：只要容器有默认路由，它就能经
  # host-gateway 够到宿主上任何一个已发布端口，**包括别的项目的数据库**，
  # 而宿主那侧改绑 127.0.0.1 也拦不住。
  #
  # 这台机器上还跑着 mica / neostor / headscale / rustdesk —— 也就是说
  # 少了 internal 这一行，沙箱里的模型生成的代码能直接连它们。
  #
  # 名字必须与 `sandbox_runner.rs::NETWORK` 写死的那个一致：那边按名字
  # 直接接，所以 `name:` 关掉 compose 的项目名前缀。
  sandbox:
    name: cortex-sandbox-net
    internal: true


volumes:
  # 记忆服务的三个卷（postgres / rustfs / workspace）不在这里了 ——
  # 它们跟着记忆服务去了 /data/cormex 那一栈。
  #
  # 这里以前还有 `cortex-prod-models`（进程内 ONNX 权重，随 local-embed
  # 一起去掉）。**已部署的机器上那个卷不会自动删**，确认没在用之后手工清：
  #     docker volume rm cortex_cortex-prod-models

  # Cortex 自己那个库的数据。**显式写 `name:`** —— compose 默认加项目名
  # 前缀，而备份脚本与手工运维都按裸名找卷，前缀会让两边指不同的东西。
  cortex-db-data:
    name: cortex-db-data
