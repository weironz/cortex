# ══════════════════════════════════════════════════════════
#  生产变体 —— 叠在 docker-compose.yml 之上，不替代它
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#  或
#    just prod-up
#
#  ── 这里**只有 agent 那一半** ─────────────────────────────
#
#  Postgres / RustFS / cortexd 都不在了：记忆服务是另一个产品，在另一个
#  仓库（github.com/weironz/cormex），由它自己的 compose 部署。两边完全
#  切开、没有相互依赖 —— Cortex 通过 HTTP 用它，与第三方 agent 同一条路。
#
#  **部署顺序因此是先记忆后 agent。** agentd 连不上记忆服务时不会崩
#  （第一条请求才失败，且那条失败说得清），但用户会先撞上它。
#
#  ── 与开发环境的差别 ──────────────────────────────────────
#
#  1. **agentd 进镜像**，不再挂宿主编出来的二进制。
#  2. **资源上限**。节点是 2C/3.5G 且已跑着别的东西，任何一个容器不封顶
#     都能把别人饿死。
#  3. 边缘（traefik）在这份 compose 之外，由宿主上那一套统一管。
#
#  ── 起之前必须确认 ────────────────────────────────────────
#
#  - `.env` 里 `CORTEX_MEMORY_URL` 指得到一台**已经在跑**的记忆服务
#  - 那台记忆服务的 `CORTEX_TOKEN_SHA256` 与这边用的凭据对得上
#  见 docs/operations.md。
# ══════════════════════════════════════════════════════════

services:
  # ─── agent 编排 ───────────────────────────────────────
  agentd:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.agentd
    image: ${AGENTD_IMAGE:-cortex/agentd:local}
    container_name: cortex-agentd
    restart: unless-stopped
    environment:
      CORTEX_AGENTD_BIND: 0.0.0.0:8081
      # 这个进程怎么找到记忆服务。**没有默认值** —— 猜一个的后果是
      # 「起来了但每条请求都 502」，而那读起来像记忆服务挂了
      CORTEX_MEMORY_URL: ${CORTEX_MEMORY_URL:?先部署记忆服务（Cormex）并把地址写进 .env}
      # **容器**怎么找到记忆服务。沙箱网段是 internal 的，出不去宿主，
      # 所以这条与上面那条不一定一样 —— 它多半要走中继
      CORTEX_SANDBOX_CALLBACK: ${CORTEX_SANDBOX_CALLBACK:-${CORTEX_MEMORY_URL}}
      CORTEX_SANDBOX_SAME_NETWORK: ${CORTEX_SANDBOX_SAME_NETWORK:-0}
      CORTEX_SANDBOX_RELAY: ${CORTEX_SANDBOX_RELAY:-http://127.0.0.1:3129}
      RUST_LOG: ${RUST_LOG:-cortex_agentd=info,warn}
    volumes:
      # 起沙箱要 docker API。见 Dockerfile.agentd 的头部 —— 那里写了
      # 「把宿主 root 交出去」这件事的另一半论证
      - /var/run/docker.sock:/var/run/docker.sock
    # socket 是 root:root 660，而这个容器跑在 uid 10001 上。
    # 加的是**组**不是用户：进程仍然不是 root
    group_add: ["0"]
    ports:
      # 只绑回环：公网入口是宿主上那套 traefik
      - "127.0.0.1:${AGENTD_PORT:-8081}:8081"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - default
      - sandbox
