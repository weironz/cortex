name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布时使用的标签
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: ""     }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: ""   }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: ""     }
          - { os: macos-13,       target: x86_64-apple-darwin,       ext: ""     }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }} -p cortexd -p cortex-cli

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          dir="cortex-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${dir}"
          cp "target/${{ matrix.target }}/release/cortexd${{ matrix.ext }}" "dist/${dir}/"
          cp "target/${{ matrix.target }}/release/cortex${{ matrix.ext }}"  "dist/${dir}/"
          cp README.md LICENSE "dist/${dir}/" 2>/dev/null || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${dir}.zip" "${dir}"
          else
            tar czf "${dir}.tar.gz" "${dir}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*
