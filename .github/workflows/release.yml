name: Release

# ══════════════════════════════════════════════════════════
#  发布流水线 —— 打产物、推镜像、发布 release，**并接着上生产**。
#  最后那一步复用 deploy.yml（见文件末尾 `deploy` 作业里的理由）：
#  人做的那次决定发生在 `git tag`，不该再要求他事后记得去点一次部署。
#
#  触发：推 `v*` tag，或手动 workflow_dispatch（要填 tag）。
#
#  ── 这个文件被整个重写过，原因值得留着 ────────────────────
#  上一版从建仓起就在，**一次都没被触发过**，里面有五个只会在
#  「真的发版那天」才暴露的问题：
#
#  1. `tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"` —— GITHUB_REF_NAME
#     **永远有值**，手动触发时它是分支名。于是 workflow_dispatch 会打出
#     一堆叫 `cortex-main-…` 的包，而 inputs.tag 从来不生效。
#     release 作业里的 `github.ref_name || inputs.tag` 是同一个毛病。
#  2. 没有 `--locked`。Cargo.lock 在仓库里却允许构建时改它，
#     五个平台可能各自解析出一套依赖。
#  3. 从头到尾**没有运行过**它要发布的那个二进制。编译得过不等于跑得起来
#     （这个项目在 Dockerfile 里已经踩过一次 libstdc++ 的坑），
#     那种产物会一路通过打包上传，直到第一个用户下载才暴露。
#  4. `cp README.md LICENSE … 2>/dev/null || true` —— 漏带 LICENSE
#     （Apache-2.0 要求随分发附带）不会有任何提示。
#  5. 完全没有 Flutter Web 与 docker 镜像，而这两样才是自托管实际会用的。
#
#  现在打包与校验都在 scripts/release-*.sh 里，**本机可以真跑**。
#  YAML 里只剩「在哪台机器上编译」。
# ══════════════════════════════════════════════════════════

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布时使用的标签（形如 v0.1.0）
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Web 镜像里的 API 地址是**编译期**钉死的（见 Dockerfile.web）。
  # 生产是同源路径分流，所以指到自己的 /api。
  # 换域名 = 重新构建镜像，不是改 .env
  CORTEX_WEB_API_BASE: https://cortex.cloudcele.com/api

jobs:
  # ══════════════════════════════════════════════════════════
  #  前置闸门 —— 在编译任何东西之前
  #
  #  版本号对不上时最不该发生的事，是先花二十分钟在五个平台上
  #  编译出一堆名字是错的产物。所有其它作业都 needs 它。
  # ══════════════════════════════════════════════════════════
  preflight:
    name: 前置检查
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # tag 只在这里解析一次，后面全部作业引用这个 output。
      # 刻意不用 `github.ref_name || inputs.tag`：ref_name 在
      # workflow_dispatch 上是分支名，永远为真，`||` 那一侧取不到
      - name: 解析 tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag '$tag' 不合法，必须是 vX.Y.Z"; exit 1; }
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 版本一致性 + 凭据泄漏 + CHANGELOG
        run: bash scripts/release-preflight.sh --tag "${{ steps.resolve.outputs.tag }}"

  # ══════════════════════════════════════════════════════════
  #  裸二进制 —— **只发 Windows**（0.1.2 起）
  #
  #  0.1.1 那一版是四平台矩阵（linux-x64 / linux-arm64 / macos-arm64 /
  #  windows-x64），每次发版编四份、占掉整条流水线里绝大部分时间。
  #  0.1.2 收敛到一个平台：前期迭代快，另外三个的成本不值。
  #
  #  ── Linux / macOS 的人还剩什么 ──────────────────────────
  #  docker 镜像 —— agent 编排、Web、沙箱、出网代理四个。
  #  **记忆服务的镜像不在这里**：它是另一个产品，在 Cormex 仓库
  #  （github.com/weironz/cormex）发它自己的。
  #  少的是「不想用 docker 的人下个二进制就跑」这条路。
  #  只要 CLI 的话 `cargo install --git` 最短。
  #  **这一条必须写进发布说明与 docs/install.md** —— 0.1.1 的下载页上有
  #  四个包，0.1.2 只剩一个，不解释就是退化。
  #
  #  ── Intel Mac 顺带记一笔 ────────────────────────────────
  #  它在 0.1.1 时就已经发不出来了（`ort-sys: no prebuilt binaries
  #  available`）。0.1.2 把 fastembed 做成了可选 feature，所以这个障碍
  #  理论上没了 —— 但没验证过，要恢复得先真编一次。
  # ══════════════════════════════════════════════════════════
  build:
    name: 二进制 ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `shared-key` 而不是 `key`：前者**替换**掉键里那段 `github.job`，
      # 后者只是再加一段。而「加一段」解决不了这里的问题 —— 发版这个作业
      # 叫 `build`、CI 那个也叫 `build`，但它们此前分别带着 `release-<target>`
      # 与什么都不带，于是两条永不相交。
      #
      # 为什么非要相交：**tag 那次运行读不到上一个 tag 的缓存**。GitHub 只让
      # 一次运行读「本 ref 的 + 默认分支的」，而两个 tag 是兄弟 ref ——
      # v0.1.10 存下的东西 v0.1.11 永远看不见。实测就是 `No cache found.`，
      # 于是 Windows 那两个作业每次发版都从零编（14.4 + 13.4 分钟）。
      #
      # 唯一能命中的来源因此只剩 **main 上 CI 存的那份**，而要命中就得让键
      # 对得上。发版会改版本号 → Cargo.lock 变 → 键末尾那段哈希不同，
      # 但 rust-cache 的 restore-keys 会按前缀回落到最近一份 ——
      # 于是那几百个第三方依赖仍然是热的，只有 workspace 自己的几个重编。
      # 这一点与 docker 的层缓存不同：那边是整层全有或全无。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      # cortex-local 是 0.1.2 加的第三个二进制：agent 循环与工具跑在
      # **用户这台机器上**。CLI 用户同样需要它 —— 没有它，`cortex` 连上
      # 远端之后工具动的是服务器的目录，而那正是这一版要解决的问题
      - name: 构建
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p cortex-agentd -p cortex-cli -p cortex-local

      # 打包脚本：逐个跑 --version 冒烟并核对版本 → 组装目录（含 LICENSE /
      # NOTICE / CHANGELOG / INSTALL.txt）→ 压缩 → 出 sha256
      - name: 打包
        shell: bash
        run: |
          bash scripts/release-package.sh \
            --target "${{ matrix.target }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  #  ⛔ Flutter Web 静态产物 —— 自 0.1.2 起**暂停发布**
  #
  #  这一版把重心收到「Windows 桌面端 + CLI」两样上，Web 的静态包先停。
  #
  #  ── 停掉之后 Web 还剩什么 ──────────────────────────────
  #  **cortex-web 镜像照常构建**（见下面的 image job），自托管部署里的
  #  Web 界面一点没少。停的只是「我自己搭静态服务器」那份 tar.gz。
  #  要它的人可以本机 `cd app && flutter build web --release`。
  #
  #  ── 怎么恢复 ────────────────────────────────────────────
  #  这个 job 的完整内容在 git 历史里（`git log -- .github/workflows/release.yml`）。
  #  贴回来之后要同步改三处：下面 `release` 的 `needs`、
  #  download-artifact 的 `pattern`、以及产物清点里那一行。
  # ══════════════════════════════════════════════════════════

  # ══════════════════════════════════════════════════════════
  #  Windows 桌面端安装程序
  #
  #  v0.1.0 只发了服务端 + CLI 的 zip，而它的名字
  #  （cortex-v0.1.0-x86_64-pc-windows-msvc.zip）看上去就像「Windows 版
  #  Cortex」。桌面端 GUI 根本不在里面 —— 第一批用户会下错东西。
  #
  #  ── 为什么只有 Windows ────────────────────────────────────
  #  不是偷懒，是三个平台的拦截强度根本不同：
  #    * Windows 的 SmartScreen 是**警告**。不签名的安装程序照样装得上，
  #      用户点「更多信息 → 仍要运行」就继续了。代价是要在安装说明里
  #      把这一屏写清楚（docs/install.md 与包里的 README.txt 都写了）
  #    * macOS 的 Gatekeeper 是**硬拒绝**。没有公证的 .dmg 打不开，
  #      而公证要 Apple Developer 账号（99 USD/年）
  #    * Linux 的 .deb/.rpm 不难，但要么自建 apt 源要么让人手动 dpkg -i，
  #      而 Linux 用户本来就更接受 flutter build
  #  所以「Windows 发、macOS/Linux 不发」不是半途而废，是按每个平台
  #  实际的拦截强度做的取舍。CHANGELOG 的「为什么不发桌面安装包」写了同一件事。
  #
  #  打包（含补 MSVC 运行库、启动冒烟、ISCC 编译）全在
  #  scripts/release-desktop-windows.sh 里，本机可以真跑。
  # ══════════════════════════════════════════════════════════
  desktop:
    name: Windows 桌面安装程序
    needs: preflight
    runs-on: windows-latest
    # ⚠️ **这一行是下面那份共用 rust-cache 真正生效的条件。**
    #
    # `build` 作业跑的是 `--target x86_64-pc-windows-msvc`，而打包脚本
    # 原先跑的是不带 target 的。两者在 cargo 眼里是两个输出目录、两套
    # 指纹，于是尽管 `shared-key` 对上了、依赖包也都下下来了，这个作业
    # 还是从零编一遍整个依赖树 —— 缓存「命中」了，编译产物一个都没用上。
    # 那正是本仓库最难发现的一类浪费：每个指标看起来都是绿的。
    #
    # 放作业级而不是某一步上：打包脚本里的 cargo 调用不止一处，
    # 而漏掉的那一处会安静地退回旧目录。
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 这个作业**此前一点 cargo 缓存都没有**，而它要编 `cortex-local`
      # （打包脚本会把它放进安装包 —— 没有它，装完的桌面端是个没有 agent
      # 的壳）。13.4 分钟里绝大部分是那次从零开始的编译。
      #
      # 与上面那个 build 作业共用同一份：两者都是 windows-latest 上的
      # release 编译，依赖树几乎完全重合。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-pc-windows-msvc

      # InnoSetup 在当前 windows runner 镜像里是预装的（6.7.x）。
      # 它曾经在 windows-2025 镜像里缺席过大半年（actions/runner-images#11349
      # 与 #11644 都以 not planned 关闭，直到 #12947 才装回来），
      # 所以脚本里留了 choco 兜底 —— 这里不预装任何东西
      # 脚本会在打包前**真的启动一次那个 GUI**（缺 DLL 的产物是立刻退出，
      # 这条断言抓的就是它）。这一步依赖 runner 有可用的桌面会话 ——
      # 本机验证过，CI 上没有。真在这里挂了而产物本身没问题，
      # 用 --no-exec 关掉它，但那意味着这份产物从没被运行过。
      - name: 打包
        shell: bash
        run: |
          bash scripts/release-desktop-windows.sh \
            --version "${{ needs.preflight.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  #  docker 镜像 —— agentd / web / sandbox / egress，各推两个 registry
  #
  #  ACR 是生产实际拉取的那个（节点在国内，Docker Hub 在那里要么慢、
  #  要么得经第三方镜像站，而那类站点缓存 tag→digest，是「拉到旧镜像
  #  还看不出来」的陷阱）。Docker Hub 那份是异地副本。
  #
  #  只做 linux/amd64。arm64 得靠 QEMU 模拟构建，而这两个镜像一个要
  #  编译整个 Rust 依赖树 + 链接预编译的 ONNX Runtime，一个要跑 dart2js ——
  #  模拟构建按小时计，而且**没人在 arm64 上验证过 ONNX Runtime 这条路**。
  #  发一个从没被启动过的 arm64 镜像，正是这条流水线要避免的事。
  # ══════════════════════════════════════════════════════════
  image:
    name: 镜像 ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # **这里没有 cortexd。** 记忆服务是另一个产品，在另一个仓库
          # （github.com/weironz/cormex）发它自己的镜像。节点上那份 compose
          # 仍然拉它 —— 那是部署把两者放在一台机器上，不是代码上的依赖。
          - image: cortex-agentd
            dockerfile: scripts/docker/Dockerfile.agentd
          - image: cortex-web
            dockerfile: scripts/docker/Dockerfile.web
          # 云沙箱那两个。挂在 compose 的 `sandbox` profile 上、默认不启用，
          # 但**镜像必须照常发** —— 节点上要开沙箱时得拉得到对应版本，
          # 而「用户想开的时候现发一版」不是一条能用的路。
          - image: cortex-sandbox
            dockerfile: scripts/docker/Dockerfile.sandbox
          - image: cortex-egress-proxy
            dockerfile: scripts/docker/Dockerfile.egress
          # 备份容器（rustic 备 PG、rclone 备 RustFS）。与上面两个同理：
          # 挂在 compose 的 backup profile 上、默认不启用，**镜像仍然每版
          # 都发** —— 节点上打开异地备份那天要拉得到对应版本，而
          # 「想开的时候现发一版」不是一条能用的路。
          - image: cortex-backup
            dockerfile: scripts/docker/Dockerfile.backup
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # cortex-web 要把 API 地址编译进去；别的镜像不需要这个 arg。
      # 传给用不到它的 Dockerfile 是无害的（会有一条 UnusedBuildArgs 警告），
      # 但显式区分能让「哪个镜像与域名绑定」这件事在文件里看得见
      # `CORTEX_GIT_SHA` 每个镜像都传：`.dockerignore` 把 `.git` 挡在构建
      # 上下文外面，容器里问不出提交号，只能由这里送进去。它落进
      # `/health` 的 `commit` —— 判「线上有没有某个修复」靠的是它，
      # 不是版本号（semver 打完 tag 的下一秒就不再唯一，2026-08-21 踩过）。
      - name: 决定 build-args
        id: args
        run: |
          {
            echo 'value<<EOF'
            echo "CORTEX_GIT_SHA=${{ github.sha }}"
            if [ "${{ matrix.image }}" = "cortex-web" ]; then
              echo "CORTEX_BASE_URL=${{ env.CORTEX_WEB_API_BASE }}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.args.outputs.value }}
          # ★ **必须关掉。** buildx 默认给镜像挂一份 provenance 证明，
          # 那会把结果变成一个 OCI index，里面带一个
          # `application/vnd.oci.empty.v1+json` 的空描述符 ——
          # 而阿里云 ACR 不认这个 media type，push 时直接
          # `denied: unknown manifest class`。
          #
          # 这条是**环境漂移**咬的：0.1.7 发的时候还没事，中间 runner 上的
          # buildx 升了一版。四个镜像会一起挂，看起来像我们改坏了什么 ——
          # 实际上本地 `docker build` 一路绿灯，因为它根本不 push。
          provenance: false
          # 只打具体版本，**不打 latest**。生产钉死版本，重启之后
          # 必须回到同一个；一个会漂移的 tag 会让「线上跑的是哪一版」
          # 变成一个查不清的问题
          tags: |
            willdockerhub/${{ matrix.image }}:v${{ needs.preflight.outputs.version }}
            registry.cn-shenzhen.aliyuncs.com/willspace/${{ matrix.image }}:v${{ needs.preflight.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 镜像必须被真的启动一次。推上去之后才发现起不来，就只能靠发下一版
      # 来修 —— 而那时它已经在 registry 里了
      - name: 冒烟
        run: |
          set -euo pipefail
          img="registry.cn-shenzhen.aliyuncs.com/willspace/${{ matrix.image }}:v${{ needs.preflight.outputs.version }}"
          if [ "${{ matrix.image }}" = "cortex-agentd" ]; then
            # `--version` 不需要 docker、不需要记忆服务，是唯一能在 CI 里
            # 无依赖执行的真实代码路径。它证明的是**动态链接通的**——
            # glibc 版本对不上那一类问题会在这里当场炸，而不是等到线上
            # 起容器时报一句 `GLIBC_2.xx not found`。
            docker run --rm "$img" --version | tee /tmp/v.txt
            grep -qF "${{ needs.preflight.outputs.version }}" /tmp/v.txt \
              || { echo "::error::镜像里的版本不是 ${{ needs.preflight.outputs.version }}"; exit 1; }
          elif [ "${{ matrix.image }}" = "cortex-sandbox" ]; then
            # 容器里跑的是 cortex-local。ENTRYPOINT 是 sandbox-entrypoint，
            # 它最后 `exec cortex-local "$@"` —— 所以 --version 直接透传进去。
            #
            # 这一条真机上咬过：入口脚本没被覆盖时 `cortex-local /bin/sh -ec ...`
            # 退出码 2，而那次失败被回落逻辑吞成一句 WARN
            docker run --rm "$img" --version
            # agent 要用的三样，缺一个都是「沙箱起来了但干不了活」
            docker run --rm --entrypoint /bin/sh "$img" -c 'git --version && python3 -V && node -v'
          elif [ "${{ matrix.image }}" = "cortex-egress-proxy" ]; then
            # scratch 镜像：没有 shell，`docker run ... sh -c` 这类招数全部不可用。
            # 唯一能做的就是真的把它跑起来，看它有没有开始监听。
            cid=$(docker run -d "$img")
            for _ in $(seq 1 20); do
              docker logs "$cid" 2>&1 | grep -q '反向中继就绪' && break
              sleep 1
            done
            docker logs "$cid" 2>&1 | grep -q '出网代理就绪'               || { echo "::error::egress 没有在监听"; docker logs "$cid"; exit 1; }
            docker rm -f "$cid" >/dev/null
          elif [ "${{ matrix.image }}" = "cortex-backup" ]; then
            # 备份容器：**三样工具在不在、版本对不对**。
            #
            # 不跑 ENTRYPOINT（那是个常驻守护循环，且没有 OSS 凭据就在
            # render-config 那步以 78/EX_CONFIG 退出）—— 这里要证明的是
            # 「镜像装对了」，不是「配置齐了」。
            #
            # ⚠️ pg 客户端**必须与生产库同大版本**：pg_basebackup 比服务端
            # 旧会直接拒（"server version mismatch"），而那件事只在凌晨三点
            # 的备份里暴露。底座就是 postgres:17-alpine，这一条钉住它没被换掉。
            docker run --rm --entrypoint /bin/sh "$img" -c '
              set -e
              rustic --version
              env -u RCLONE_VERSION rclone --version | head -1
              pg_basebackup --version
              pg_dump --version
              pg_verifybackup --version
              pg_basebackup --version | grep -q "PostgreSQL) 17\." \
                || { echo "::error::pg 客户端不是 17.x，与生产库对不上"; exit 1; }
              # 编排脚本三个都在且可执行 —— COPY 漏了的话容器起来才发现
              for f in daemon.sh run.sh render-config.sh; do
                test -x "/opt/cortex-backup/$f" || { echo "::error::缺 $f"; exit 1; }
              done
              # 以 postgres 身份跑，因为 pg_basebackup 写出来的数据目录
              # 必须属于启动它的那个用户（见 Dockerfile 里那段）
              test "$(id -un)" = postgres || { echo "::error::默认用户不是 postgres"; exit 1; }
            '
          else
            cid=$(docker run -d -p 18080:80 "$img")
            for _ in $(seq 1 30); do
              curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:18080/healthz
            # index.html 必须真的发得出来，而且 SPA 回落要生效
            curl -fsS http://127.0.0.1:18080/ | grep -q '<html'
            curl -fsS http://127.0.0.1:18080/some/deep/link | grep -q '<html'
            docker rm -f "$cid" >/dev/null
          fi

  # ══════════════════════════════════════════════════════════
  #  汇总并**直接发布** release
  #
  #  0.1.2 之前这里建的是 draft，理由是「产物齐不齐、版本对不对，人看一眼
  #  再按发布」。改成直接发布，因为那道人工确认在实践中是空的 ——
  #  流水线跑完就去点发布，没有人真的逐个下载核对。
  #
  #  发布仍然是不可逆的（撤回改变不了「已经有人拉走了」），所以把那份把关
  #  下沉成了**自动的**：
  #    * `preflight` —— 版本一致、CHANGELOG 有条目、没有疑似凭据文件
  #    * `release-package.sh` —— 每个二进制真跑一次 --version 并核对版本号
  #    * `release-desktop-windows.sh` —— 真启动一次 GUI，几秒内没自己退出才算过
  #    * 下面的产物清点 —— 少一个当场红
  #
  #  一道会跑的检查胜过一道没人做的确认。要退回 draft 只需把最后那行
  #  `draft:` 改回 true。
  # ══════════════════════════════════════════════════════════
  release:
    name: 发布 release
    needs: [preflight, build, desktop, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pattern 是必需的，不是洁癖：不给 pattern 时它下载**全部**产物，
      # 而 docker/build-push-action 会顺手上传两个 0 字节的
      # `*.dockerbuild` 溯源记录 —— 那两个下不下来，
      # 报的却是 `Artifact download failed after 5 retries`，
      # 看上去像网络抖动（我们据此重跑了两次，两次都同样失败）。
      #
      # 发版产物应当是一份**显式清单**，而不是「把桶里的东西全拿走」——
      # 后者会让任何一个 action 顺手上传的东西变成发版的一部分。
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
          # `bin-*`（裸二进制）自 0.1.2 起不再产出，见上面被停掉的 build job
          # `web` 自 0.1.2 起不再产出（见上面被停掉的 job）；
          # `bin-*` 回来了，但只有 windows 一个平台
          pattern: "{bin-*,desktop-*}"

      # 逐平台的 .sha256 是构建机上算的，这里汇总成一份。
      # 先删掉单份的再算，否则 SHA256SUMS 里会混进「校验和文件的校验和」
      #
      # *.exe 是 Windows 桌面安装程序。它比别的产物更需要这份校验和：
      # 它没有代码签名，用户只能靠对哈希确认手上这份就是发布页上那份 ——
      # 安装说明里让人 `certutil -hashfile` 对的，就是这里生成的东西
      - name: 汇总校验和
        run: |
          set -euo pipefail
          cd dist
          rm -f ./*.sha256 SHA256SUMS
          # nullglob：停掉 build job 之后 *.zip 不再有任何匹配，而默认情况下
          # 未匹配的 glob 会**原样保留**，于是 sha256sum 收到一个字面量
          # `*.zip` 并以「文件不存在」失败 —— 一个纯粹由「少了一类产物」
          # 引发的红灯，和校验和本身无关。
          # 留着 *.zip 这一条是为了恢复 build job 时不用再想起来加回来
          shopt -s nullglob
          files=( *.tar.gz *.zip *.exe )
          [ ${#files[@]} -gt 0 ] || { echo "::error::dist 里一个产物都没有"; exit 1; }
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # 少一个平台时 release 照样建得出来，只是那个平台的用户下载页上
      # 没有东西 —— 而没有任何红灯。所以在这里点名清点
      - name: 产物清点
        run: |
          set -euo pipefail
          cd dist
          v="${{ needs.preflight.outputs.version }}"
          miss=0
          # 这张清单是发版产物的**唯一权威**：少一个必须当场红，
          # 不能静默发出去。（v0.1.0 删掉 Intel Mac 时漏改过这里，被它拦下了。）
          #
          # 0.1.2 的下载页上只有两样可执行产物，都在这里点名。
          # Flutter Web 的 tar.gz 这一版停发了（见上方被停掉的 job）；
          # Linux / macOS 裸二进制也只剩 docker 镜像那条路。
          # 恢复其中任何一样时**必须同步加回这一段** ——
          # 否则清点照常绿，而下载页上少了东西没有任何提示
          [ -f "cortex-v$v-x86_64-pc-windows-msvc.zip" ] \
            || { echo "::error::缺少 Windows 二进制包（CLI + 本地 agent + 编排器）"; miss=1; }
          [ -f "cortex-desktop-v$v-x86_64-pc-windows-msvc-setup.exe" ] \
            || { echo "::error::缺少 Windows 桌面安装程序"; miss=1; }
          exit $miss

      - name: 取 CHANGELOG 里这一版的段落
        run: |
          set -euo pipefail
          v="${{ needs.preflight.outputs.version }}"
          # 用 index() 逐字比对，**不用动态正则**。
          #
          # 原来这里是 `$0 ~ "^## +\\[?" ver "\\]?"`，它是坏的：awk 把字符串里的
          # `\[` 当成普通 `[`（gawk 会明说 "escape sequence '\[' treated as plain
          # '['"），于是那段正则退化成 `^## +[?0.1.0]?` —— 一个**字符组**，
          # 结果是「任何 `## ` 开头的标题都算命中」。
          #
          # 这个 bug 在 v0.1.0 发版时不可见：那时 CHANGELOG 里 `## [0.1.0]`
          # 恰好是第一个二级标题，抓错也抓到它。加了「未发布」一节之后
          # 它立刻变成「把未发布的内容当成这一版的发布说明发出去」——
          # 而 notes.md 非空，`[ -s notes.md ]` 那道检查照样绿。
          awk -v ver="$v" '
            !on && (index($0, "## [" ver "]") == 1 ||
                    index($0, "## "  ver " ") == 1 ||
                    $0 == "## " ver) { on = 1; print; next }
            on && index($0, "## ") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md 里取不到 $v"; exit 1; }
          {
            echo; echo "---"; echo
            echo '### 服务端（agent 编排）：这一版只发 docker 镜像'
            echo
            echo '**从 0.1.2 起不再发裸二进制**（`cortex-vX-<平台>.tar.gz` / `.zip`）。'
            echo '前期迭代快，四个平台各编一份占掉了整条发版流水线的绝大部分时间。'
            echo '能力没少 —— 镜像里该有的都在；少的是'
            echo '「不想用 docker 就下个二进制跑」这条路。要 CLI 又不想要 docker：'
            echo '`cargo install --git https://github.com/${{ github.repository }} cortex-cli`。'
            echo
            echo '```'
            echo "docker pull registry.cn-shenzhen.aliyuncs.com/willspace/cortex-agentd:v$v"
            echo "docker pull willdockerhub/cortex-agentd:v$v"
            echo '```'
            echo
            echo '**记忆服务是单独一个产品**，在 [Cormex](https://github.com/weironz/cormex)：'
            echo '它管存储、检索与 MCP 门面，独立发版、也能单独用。自托管要两个都起 ——'
            echo '先记忆后 agent（agent 连不上记忆服务时一条对话都开不了）。'
            echo
            echo '自托管完整步骤见 [docs/install.md](https://github.com/${{ github.repository }}/blob/v'"$v"'/docs/install.md)。'
            echo '**第一步一定是生成凭据** —— 没有 `CORTEX_AUTH_TOKEN_SHA256` 时记忆服务拒绝启动。'
            echo
            echo '### Windows 桌面端'
            echo
            echo '`cortex-desktop-v'"$v"'-x86_64-pc-windows-msvc-setup.exe` 是**客户端 GUI**，'
            echo '不是服务端 —— 它仍然需要一台记忆服务（地址在装完第一屏里填）。'
            echo
            echo '这个安装程序**没有代码签名**，Windows SmartScreen 会拦一次：'
            echo '点「更多信息」→「仍要运行」。要不要点请自己判断 ——'
            echo '判断依据是 `SHA256SUMS`，用 `certutil -hashfile <文件> SHA256` 对一遍。'
            echo 'macOS / Linux 桌面端这一版不发，自己 `flutter build`，理由见 CHANGELOG。'
            echo
            echo '产物校验和见 `SHA256SUMS`。'
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Cortex ${{ needs.preflight.outputs.tag }}
          # 直接发布，不留 draft。理由见上面这个 job 的注释：
          # 把关下沉成了流水线里那四道会跑的检查
          draft: false
          body_path: notes.md
          files: dist/*

  # ── 上生产 ────────────────────────────────────────────────
  #
  # 发版是**一条龙**：构建 → 发产物 → 上生产。人做的那次决定发生在
  # `git tag`，不该再要求他事后记得去点一次部署 —— 那种「还差最后一步」
  # 的流程，漏掉的表现是「发了但线上还是旧版」，而它没有任何红灯。
  #
  # `needs: release` 而不是 `needs: image`：产物没发成功就不该上生产。
  # 那种状态（线上是新版、下载页是旧版）比两者都旧更难解释。
  #
  # 复用 deploy.yml 而不是抄一份：那里面的健康检查有五条硬断言
  # （版本、认证、数据库真接上、对象存储真接上、Web 出得来），
  # 抄第二份的下场是两边迟早不一样，而不一样只有出事时才发现。
  #
  # **compose 改了不用再做任何额外的事**（2026-08-23 起）：ansible 每次部署
  # 都把 tag 上那份 compose 与渲染好的 .env 一起送过去。此前 CI 只送哈希、
  # 文件要人带外 scp，忘了的表现是这一步在跑完二十多分钟之后才红。
  deploy:
    needs: [preflight, release]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    # 部署要用 DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS
    secrets: inherit
