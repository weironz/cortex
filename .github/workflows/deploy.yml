name: Deploy

# ══════════════════════════════════════════════════════════
#  把某个**已发布**的版本放到线上。
#
#  **没有 `on: push`**：哪个版本在线上，是人做的决定，不是合并的副作用。
#
#  但**打 tag 就是那个决定**，所以 Release 走完之后会自动调这里
#  （`release.yml` 的 deploy job，走下面的 `workflow_call`）。
#  发版是一条龙：构建 → 发产物 → 上生产。人做的那次决定发生在 `git tag`。
#
#  `workflow_dispatch` 保留着，用来把线上回退到某个更早的版本 ——
#  那是与「发新版」完全不同的一件事，不该只能靠再打一个 tag 来做。
#
#  ── ⚠️ 安全模型：这把密钥**等于节点 root** ────────────────
#
#  它曾经不是。节点上 `~cortex-deploy/.ssh/authorized_keys` 用
#      restrict,command="/usr/bin/sudo /usr/local/sbin/cortex-deploy"
#  钉死，CI 只送 compose 的 sha256 不送文件 —— 于是一把泄露的密钥只能在
#  已发布的版本之间切换。2026-08-23 改用 ansible 之后那道限制撤掉了：
#  ansible 要把模块推过去执行，任何 forced command 都会挡住它。
#
#  **为什么可以接受**：那道闸挡住的比它看起来少。
#  `deploy/docker-compose.yml` 把 /var/run/docker.sock 挂进 agentd（文件里
#  自己写着「这是把宿主 root 交给它」），而 agentd 的镜像 tag 由 CI 决定、
#  ACR 推送凭据就在同一个 GitHub Secrets 里（见 release.yml）。也就是说
#  **一次 Actions 沦陷早就等于节点 root** —— 推个恶意 cortex-agentd:v9.9.9
#  再部署它即可，compose 那道闸完全不在这条路上。它真正还挡得住的只有
#  「单独泄露 DEPLOY_SSH_KEY」这一种。
#
#  换来的是：compose 与 .env 由 ansible 送过去，不再要人带外 scp。此前
#  改一次 compose 就得手动同步，忘了的表现是**流水线跑二十多分钟最后一步红**。
#
#  ⚠️ 真要把「Actions 沦陷 ≠ 节点 root」拿回来，该做的是把 registry 凭据换成
#  GitHub OIDC → 阿里云 RAM 角色，而不是守 compose 这道门。没排期，记着。
#
#  ⚠️ **凭据不经过 CI。** 节点上 /data/cortex/.env.secrets 由人装机时写一次，
#  ansible 只检查它在不在、从不写它。见 deploy/.env.example 的 B 节。
# ══════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v 前缀，例如 0.1.0'
        required: true
  # 给 release.yml 调用。两个入口共用**同一份**实现 ——
  # 抄一份到 release.yml 里的话，两边的健康检查迟早会长得不一样，
  # 而那种不一致只有在某次部署出事时才会被发现
  workflow_call:
    inputs:
      version:
        type: string
        required: true

# 两次部署同时跑会在节点的 .env 上打架（都在改 CORTEX_VERSION）。
# 排队而不是取消：**半应用的部署比慢的部署更糟**。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 留着是为了仓库上的部署历史 / 审计线索，**不是**当闸门用：
    # 这个 environment 刻意不配 required reviewer。
    # workflow_dispatch 且没有 on: push，本身就意味着有人决定要发；
    # 再加一道审批只是对同一个决定的二次确认，对单维护者是摩擦不是安全。
    # 哪天不再是单维护者，在 Settings → Environments 里加审批人即可。
    environment:
      name: production
      url: https://cortex.cloudcele.com

    steps:
      - uses: actions/checkout@v5
        with:
          # 要 tag 上那棵树：送到节点的 compose 与 ansible playbook 都从这里来，
          # 于是一个版本永远只会被部署到它一起发布的那份编排上
          ref: v${{ inputs.version }}

      - name: 拒绝一切不是 X.Y.Z 的东西
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version 必须是 X.Y.Z"; exit 1; }

      # ansible 只装在**这里**。目标机器不装 ansible —— 但需要 python3
      # （模块推过去要它执行）与 python3-requests，那两样由 provision.yml 装。
      - name: 装 ansible
        run: |
          set -euo pipefail
          pipx install --include-deps ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: 部署
        env:
          # ⚠️ 这**是**一把全权密钥（见文件头）。ansible 用它 become 到 root。
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # ansible 检测到不是 tty 就关掉颜色，而 Actions 的日志**认 ANSI**。
          # 关着的话失败那一行与其余几十行长得一模一样，得逐行读
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 钉死的，不在运行时 ssh-keyscan —— 现在扫等于信任任何应答的人，
          # 那不是验证
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          cd ansible
          ansible-playbook deploy.yml \
            --private-key ~/.ssh/id_ed25519 \
            -e version=${{ inputs.version }}

      # 不信部署脚本自己的报喜。它说健康只代表容器的 HEALTHCHECK 绿了，
      # 证明不了 traefik 的路由、StripPrefix、证书这一整条链路是通的，
      # 更证明不了线上跑的真是这一版
      - name: 验证线上真的在跑这一版
        run: |
          set -euo pipefail

          # ── 记忆服务（cortexd）───────────────────────────
          #
          # 它由**另一个仓库**（github.com/weironz/cormex）发版，所以这里
          # **不断言它的版本号** —— 两条时间线各走各的，拿这次部署的版本去
          # 比它，第一次错开就会报一个与病因无关的假警报。
          #
          # 但仍然要查它的三个字段：整套东西离开记忆服务什么都不是，
          # 而这三条各自对应一种「看起来正常、其实在服务假数据」的失败。
          mem=$(curl -fsS https://cortex.cloudcele.com/api/health); echo "$mem"

          # 认证必须是开着的。一个 auth=disabled 的线上实例会把整个记忆库
          # 交给任何能连上的人，而这件事没有任何别的症状
          echo "$mem" | grep -q '"auth":"token"' \
            || { echo "记忆服务的认证没开 —— 拒绝认为这次部署成功"; exit 1; }

          # ★ `"status":"ok"` 与 docker 的 HEALTHCHECK **都不代表接上了后端**。
          # 本机实测过：少一个 DEEPSEEK_API_KEY，cortexd 就会整个回落到 mock
          # 数据源继续启动 —— /health 报 status ok、docker 转 healthy，
          # 而 database 是 "not_wired"，它在服务假数据。
          # 同理 RUSTFS 凭据不对时 blob_backend 会变成 "local_fs"：
          # 上传的媒体只存在于容器里，不进对象存储、不随备份走、签不出
          # presigned URL —— 而这一切没有任何别的症状。
          echo "$mem" | grep -q '"database":"ok"' \
            || { echo "数据库没接上 —— 记忆服务回落到 mock 了"; exit 1; }
          echo "$mem" | grep -q '"blob_backend":"s3"' \
            || { echo "对象存储没接上（回落到本地文件系统）—— 媒体不会进备份"; exit 1; }

          # ── agent 编排（agentd）─────────────────────────
          #
          # **这个才是这次部署的版本。** 打的是 `/api/sandbox/health` 而不是
          # `/api/health`：后者按路径分流归了记忆服务，从公网永远问不到
          # 这个进程。见 agentd `routes.rs` 里那条路由上的注释。
          agent=$(curl -fsS https://cortex.cloudcele.com/api/sandbox/health); echo "$agent"

          echo "$agent" | grep -q '"version":"${{ inputs.version }}"' \
            || { echo "版本不符 —— agentd 报的不是 ${{ inputs.version }}"; exit 1; }
          echo "$agent" | grep -q '"role":"agent-orchestrator"' \
            || { echo "/api/sandbox/health 答话的不是 agentd —— traefik 的分流配错了"; exit 1; }

          # **「起来了」不等于「连得上它依赖的东西」。**
          #
          # 这条原先断言的是 `memory_reachable:true`。长期记忆 2026-08-17 整条
          # 拆掉之后 agentd 不再连记忆服务，那个字段也从 /health 里删了 ——
          # 于是这条断言在 0.1.11 的部署上**必然失败**，而部署本身是成功的。
          # （`routes.rs` 里已经有单元测试钉住「这两个字段不存在」，只有这里漏了。
          # 能力下线时得把断言一起下线，见 CLAUDE.md 约束 2 的同一个道理。）
          #
          # 换成现在真正的那条依赖：agentd → 它自己的库。理由一样硬 ——
          # 部署用的是 `--no-deps`，它**忽略** depends_on 的健康等待，所以
          # agentd 确实可能在 postgres 还没接受连接时起来，而它起来第一件事
          # 就是跑 migration。连不上库的 agentd 一句历史都读不出来。
          echo "$agent" | grep -q '"database":"ok"' \
            || { echo "agentd 连不上自己的库 —— 一条会话都读不出来"; exit 1; }

          # Web 也要真的发得出来（traefik 的路径分流三条都得对）
          curl -fsS https://cortex.cloudcele.com/ | grep -q '<html'
