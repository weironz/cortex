name: Deploy

# ══════════════════════════════════════════════════════════
#  把某个**已发布**的版本放到线上。
#
#  **没有 `on: push`**：哪个版本在线上，是人做的决定，不是合并的副作用。
#
#  但**打 tag 就是那个决定**，所以 Release 走完之后会自动调这里
#  （`release.yml` 的 deploy job，走下面的 `workflow_call`）。
#  发版是一条龙：构建 → 发产物 → 上生产。人做的那次决定发生在 `git tag`。
#
#  `workflow_dispatch` 保留着，用来把线上回退到某个更早的版本 ——
#  那是与「发新版」完全不同的一件事，不该只能靠再打一个 tag 来做。
#
#  ── ⚠️ 安全模型：这把密钥**等于节点 root** ────────────────
#
#  它曾经不是。节点上 `~cortex-deploy/.ssh/authorized_keys` 用
#      restrict,command="/usr/bin/sudo /usr/local/sbin/cortex-deploy"
#  钉死，CI 只送 compose 的 sha256 不送文件 —— 于是一把泄露的密钥只能在
#  已发布的版本之间切换。2026-08-23 改用 ansible 之后那道限制撤掉了：
#  ansible 要把模块推过去执行，任何 forced command 都会挡住它。
#
#  **为什么可以接受**：那道闸挡住的比它看起来少。
#  `deploy/docker-compose.yml` 把 /var/run/docker.sock 挂进 agentd（文件里
#  自己写着「这是把宿主 root 交给它」），而 agentd 的镜像 tag 由 CI 决定、
#  ACR 推送凭据就在同一个 GitHub Secrets 里（见 release.yml）。也就是说
#  **一次 Actions 沦陷早就等于节点 root** —— 推个恶意 cortex-agentd:v9.9.9
#  再部署它即可，compose 那道闸完全不在这条路上。它真正还挡得住的只有
#  「单独泄露 DEPLOY_SSH_KEY」这一种。
#
#  换来的是：compose 与 .env 由 ansible 送过去，不再要人带外 scp。此前
#  改一次 compose 就得手动同步，忘了的表现是**流水线跑二十多分钟最后一步红**。
#
#  ⚠️ 真要把「Actions 沦陷 ≠ 节点 root」拿回来，该做的是把 registry 凭据换成
#  GitHub OIDC → 阿里云 RAM 角色，而不是守 compose 这道门。没排期，记着。
#  **但那条路目前走不通**：这台节点连不上 100.100.100.200（实例元数据），
#  而 RAM 的临时凭据正是从那里取的。前置条件是 VPC / 安全组那边的网络问题，
#  不是这台机器上能改的。见 docs/deploy.md 二节末尾。
#
#  ⚠️ **凭据不经过 CI。** 节点上 /data/cortex/.env.secrets 由人装机时写一次，
#  ansible 只检查它在不在、从不写它。见 deploy/.env.example 的 B 节。
# ══════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v 前缀，例如 0.1.0'
        required: true
  # 给 release.yml 调用。两个入口共用**同一份**实现 ——
  # 抄一份到 release.yml 里的话，两边的健康检查迟早会长得不一样，
  # 而那种不一致只有在某次部署出事时才会被发现
  workflow_call:
    inputs:
      version:
        type: string
        required: true

# 两次部署同时跑会在节点的 .env 上打架（都在改 CORTEX_VERSION）。
# 排队而不是取消：**半应用的部署比慢的部署更糟**。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 留着是为了仓库上的部署历史 / 审计线索，**不是**当闸门用：
    # 这个 environment 刻意不配 required reviewer。
    # workflow_dispatch 且没有 on: push，本身就意味着有人决定要发；
    # 再加一道审批只是对同一个决定的二次确认，对单维护者是摩擦不是安全。
    # 哪天不再是单维护者，在 Settings → Environments 里加审批人即可。
    environment:
      name: production
      url: https://cortex.cloudcele.com

    steps:
      # ── ⚠️ **默认分支**，不是被部署的那个 tag ──────────────
      #
      # 部署机制（ansible/）与应用版本是**两条独立的时间线**。旧设计里这一条
      # 已经写着了（它拿节点上的策略脚本与 main 比，不与 tag 比），而我第一版
      # 把两者都挪到了 tag 上 —— 后果不只是「新东西在老 tag 上不存在」，
      # 而是**回滚到任何早于 ansible 的版本都会失败**：
      #
      #     [ERROR]: The requirements file 'ansible/requirements.yml' does not exist.
      #
      # 2026-08-23 实测撞到（部署 v0.1.18 那次）。
      #
      # ⚠️ **`ref:` 不能省，这一条是同一天撞的第二次。** 不写 ref 时
      # actions/checkout 取的是**触发工作流的那个 ref**，而这个 workflow
      # 有两个入口，它们的 ref 不一样：
      #
      #   * workflow_dispatch（手动）→ main       ← 我当时只验了这一个，通过
      #   * workflow_call（release.yml 调）→ tag  ← 发 v0.1.19 时炸在这里
      #
      # 后果有两层：ansible/ 会退回 tag 上那份（旧 tag 上根本没有），
      # 而且下一步 `git fetch refs/tags/vX:refs/tags/vX` 会因为**本地已经在
      # 那个 tag 上**而被拒绝（would clobber existing tag），退出码 1、
      # `-q` 还把原因吞了 —— 日志里只剩一句 `Process completed with exit code 1`。
      #
      # 写死 ref 之后两个入口拿到的是同一份东西，这正是「一份实现两个入口」
      # 本来要保证的事。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ⚠️ **这道闸盯着上面那个 `ref:` 真的生效了。**
      #
      # 写死 ref 之后两个入口应当拿到同一份东西，但「应当」正是这一天里
      # 栽过两次的地方，而 workflow_call 那条路**只有真发版时才走得到** ——
      # 手动跑一百次也验不到它。所以与其等下次发版才发现，不如让它自己喊。
      #
      # 具体防的是两种静默退化：
      #   1. `github.event.repository.default_branch` 取到空值（某个 event
      #      的 payload 里没有 repository 对象）→ checkout 会**悄悄 fallback**
      #      到触发 ref，于是 workflow_call 又拿回了 tag，而日志一切正常。
      #   2. 拿到的确实不是默认分支 —— 老 tag 上没有 ansible/ 目录，
      #      症状是三步之后一句 "requirements file does not exist"。
      - name: 确认 ansible/ 真的来自默认分支
        run: |
          set -euo pipefail
          want='${{ github.event.repository.default_branch }}'
          [ -n "$want" ] || {
            echo "::error::default_branch 表达式取到空值 —— checkout 会 fallback 到触发 ref"
            exit 1
          }
          have="$(git rev-parse --abbrev-ref HEAD)"
          [ "$have" = "$want" ] || {
            echo "::error::ansible/ 取自 '$have'，应当是 '$want'（checkout 的 ref 没生效）"
            exit 1
          }
          [ -f ansible/deploy.yml ] || {
            echo "::error::ansible/deploy.yml 不在 —— 这不是默认分支的内容"
            exit 1
          }
          echo "ansible/ 来自 $have ✓"

      - name: 拒绝一切不是 X.Y.Z 的东西
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version 必须是 X.Y.Z"; exit 1; }

      # ── 但 compose 要**那个 tag 上**那份 ──────────────────
      #
      # 与上面正好相反，而这个不对称是有意的：一个版本应当被部署到它一起
      # 发布的那份编排上（compose 里有它的服务、端口、健康检查）。
      # 部署机制则该是最新的 —— 修了一个部署 bug，不该只有以后的版本受益。
      - name: 取 tag 上那份 compose
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          # `--force` 与去掉 `-q`：上面那次失败里，fetch 因为「本地已有同名
          # tag」被拒，而 -q 把 stderr 一起吞了，日志上只剩一句 exit code 1。
          # 修好 checkout 的 ref 之后这种情况不该再发生，但一个只在出事时
          # 才闭嘴的命令不值得留着
          git fetch --force --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "${tag}" -- deploy/docker-compose.yml
          echo "compose 取自 ${tag}，ansible/ 取自默认分支 $(git rev-parse --abbrev-ref HEAD)"

      # ansible 只装在**这里**。目标机器不装 ansible —— 但需要 python3
      # （模块推过去要它执行）与 python3-requests，那两样由 provision.yml 装。
      #
      # ansible-core 在 ubuntu runner 上是**预装**的，再 pipx 装一遍只会刷
      # 二十行「File exists … Not modifying」。这里只装我们钉了版本的那三个
      # collection —— 那才是会影响 playbook 行为的部分。
      #
      # ⚠️ **重试三次。** galaxy.ansible.com 会偶发 500（2026-10-24 连着两次
      # 把部署卡在这一步，节点一次都没被碰过）。那不是我们的错，但「上游抖
      # 一下就发不出去、而且整条流水线红在安装依赖」没有道理 —— 真正要绿的
      # 是下面那条部署与验证。
      - name: 装 ansible collection
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if ansible-galaxy collection install -r ansible/requirements.yml; then
              exit 0
            fi
            echo "::warning::第 ${i} 次装 collection 失败，$((i * 15)) 秒后重试"
            sleep $((i * 15))
          done

          # ── galaxy 挂了就改从 GitHub 源码树装 ──────────────────
          #
          # 2026-10-24 实测：artifact 的 302 目标
          # （`/api/pulp/content/...`）恒回 **500**。那不是偶发，重试三次
          # 一次都没成，而它挡在部署前面 —— 节点整整一天没被碰过。
          #
          # collection 的仓库布局**本身就是**合法的 collection：把 git tag
          # 上的源码摆进 `ansible_collections/<ns>/<name>` 就能用，不需要
          # galaxy 打包。GitHub 一定够得着（这一整个 job 就是从那儿 checkout 的）。
          #
          # ⚠️ 这些版本是**手钉**的，与 `requirements.yml` 的版本区间各记
          # 各的：那边是 galaxy 那条路的约束，这里只认 tag。改一边改另一边。
          echo "::warning::galaxy 不可用，改从 GitHub 的 tag 装（版本手钉在这里）"
          B="${HOME}/.ansible/collections/ansible_collections"
          mkdir -p "${B}/community" "${B}/ansible"
          clone() { git clone -q --depth 1 --branch "$2" "$1" "$3" && echo "  ✔ $3 (${2})"; }
          clone https://github.com/ansible-collections/community.docker.git \
                4.8.9  "${B}/community/docker"
          clone https://github.com/ansible-collections/community.library_inventory_filtering.git \
                1.1.5  "${B}/community/library_inventory_filtering_v1"
          clone https://github.com/ansible-collections/community.general.git \
                11.4.9 "${B}/community/general"
          clone https://github.com/ansible-collections/ansible.posix.git \
                2.2.2  "${B}/ansible/posix"
          ansible-galaxy collection list

      - name: 部署
        env:
          # ⚠️ 这**是**一把全权密钥（见文件头）。ansible 用它 become 到 root。
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # ansible 检测到不是 tty 就关掉颜色，而 Actions 的日志**认 ANSI**。
          # 关着的话失败那一行与其余几十行长得一模一样，得逐行读
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 钉死的，不在运行时 ssh-keyscan —— 现在扫等于信任任何应答的人，
          # 那不是验证
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          cd ansible
          ansible-playbook deploy.yml \
            --private-key ~/.ssh/id_ed25519 \
            -e version=${{ inputs.version }}

      # 不信部署脚本自己的报喜。它说健康只代表容器的 HEALTHCHECK 绿了，
      # 证明不了 traefik 的路由、StripPrefix、证书这一整条链路是通的，
      # 更证明不了线上跑的真是这一版
      - name: 验证线上真的在跑这一版
        run: |
          set -euo pipefail

          # ── 记忆服务（cortexd）───────────────────────────
          #
          # 它在另一个仓库（github.com/weironz/cormex）发版。这一侧
          # **不知道是 cormex 已下线还是路由没通**，两个状态对公网来说是同
          # 一个样子（`404` 或 SPA fallback 的 index.html）——所以**查而不
          # 拦**：答得上 JSON 就顺手核几个必须开着的开关，拿不到就跳过。
          # 真正被这边部署改坏的那一件（agentd 自己）在下面单断言，
          # 那是这次部署画的红线。
          mem=$(curl -fsS https://cortex.cloudcele.com/api/health) || mem=''
          case "$mem" in
            '{'*) echo "$mem"
              if echo "$mem" | grep -q '"auth":"token"'; then
                # 能答 JSON 才查开关。auth=disabled 会把记忆库交给任何人，
                # 且没有任何别的症状；要的就是无止境的手动检查
                echo "$mem" | grep -q '"database":"ok"' \
                  || { echo "记忆服务回落到 mock（少 DEEPSEEK_API_KEY 那类）"; exit 1; }
                echo "$mem" | grep -q '"blob_backend":"s3"' \
                  || { echo "对象存储没接上 —— 媒体不会进备份（RUSTFS 凭据错那类）"; exit 1; }
              else
                echo "记忆服务没在答 —— 拦不下来 != 不该拦（这条是 check，不是 gate）" >&2
              fi ;;
            *)  echo "记忆服务不在线（not_wired）—— 不拦部署，记一条" >&2 ;;
          esac

          # ── agent 编排（agentd）─────────────────────────
          #
          # **这个才是这次部署的版本。** 打的是 `/api/sandbox/health` 而不是
          # `/api/health`：后者按路径分流归了记忆服务，从公网永远问不到
          # 这个进程。见 agentd `routes/mod.rs` 里那条路由上的注释。
          agent=$(curl -fsS https://cortex.cloudcele.com/api/sandbox/health); echo "$agent"

          echo "$agent" | grep -q '"version":"${{ inputs.version }}"' \
            || { echo "版本不符 —— agentd 报的不是 ${{ inputs.version }}"; exit 1; }
          echo "$agent" | grep -q '"role":"agent-orchestrator"' \
            || { echo "/api/sandbox/health 答话的不是 agentd —— traefik 的分流配错了"; exit 1; }

          # **「起来了」不等于「连得上它依赖的东西」。**
          #
          # 这条原先断言的是 `memory_reachable:true`。长期记忆 2026-08-17 整条
          # 拆掉之后 agentd 不再连记忆服务，那个字段也从 /health 里删了 ——
          # 于是这条断言在 0.1.11 的部署上**必然失败**，而部署本身是成功的。
          # （`routes/routes_test.rs` 里已经有单元测试钉住「这两个字段不存在」，只有这里漏了。
          # 能力下线时得把断言一起下线，见 CLAUDE.md 约束 2 的同一个道理。）
          #
          # 换成现在真正的那条依赖：agentd → 它自己的库。理由一样硬 ——
          # 部署用的是 `--no-deps`，它**忽略** depends_on 的健康等待，所以
          # agentd 确实可能在 postgres 还没接受连接时起来，而它起来第一件事
          # 就是跑 migration。连不上库的 agentd 一句历史都读不出来。
          echo "$agent" | grep -q '"database":"ok"' \
            || { echo "agentd 连不上自己的库 —— 一条会话都读不出来"; exit 1; }

          # Web 也要真的发得出来（traefik 的路径分流三条都得对）
          curl -fsS https://cortex.cloudcele.com/ | grep -q '<html'

          # ★ **返回 200 不等于页面能启动。**
          #
          # wasm-gc 的胶水脚本是 `main.dart.mjs`，浏览器用 `import()` 按
          # module 加载它，而 module script 的 MIME 在 HTML 规范里是**强校验**
          # 的：nginx 的 `mime.types` 里没有 `.mjs` 时会回落成
          # `application/octet-stream`，import() 当场被拒 —— 整页白屏，而
          # 每一条 HTTP 都是 200、上面那句 `grep '<html'` 也照样过。
          #
          # 2026-10-24 就这么白了一整版（0.1.36/0.1.37 都没被抓到）：部署输出
          # 全绿、版本探针答对了、用户打开是一片空白。**只有真浏览器会说话，
          # 而这里没有浏览器** —— 所以退一步，钉住那两个文件的 Content-Type，
          # 它们是浏览器挑渲染管线的全部依据。
          mjs_type=$(curl -fsSI https://cortex.cloudcele.com/main.dart.mjs \
                     | tr -d '\r' | grep -i '^content-type:' || true)
          case "$mjs_type" in
            *javascript*) ;;
            *) { echo "main.dart.mjs 的 MIME 不是 JS（${mjs_type:-没有这个头}）——"
                 echo "浏览器会拒绝 import()，整页白屏（nginx 的 types 里漏了 mjs？）"; exit 1; } ;;
          esac
          wasm_type=$(curl -fsSI https://cortex.cloudcele.com/main.dart.wasm \
                      | tr -d '\r' | grep -i '^content-type:' || true)
          case "$wasm_type" in
            *application/wasm*) ;;
            *) { echo "main.dart.wasm 的 MIME 不是 application/wasm（${wasm_type:-没有这个头}）"; exit 1; } ;;
          esac
