name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── 格式与静态检查 ──────────────────────────────────────
  lint:
    name: 格式与 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  # ── 运维脚本 ───────────────────────────────────────────
  # 备份 / 恢复脚本最糟的失效方式是：平时没人跑，需要它的那天才发现
  # 第 200 行有个语法错。这道门只花几秒，挡的正是这一类。
  scripts:
    name: 运维脚本静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash 语法检查
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "== $f"
            bash -n "$f"
          done

      # shellcheck 在 ubuntu runner 上自带。SC1091 是「source 的文件解析不到」，
      # lib.sh 是运行时按路径拼出来的，静态分析看不见，不是问题
      - name: shellcheck
        run: shellcheck --severity=warning --exclude=SC1091 scripts/*.sh deploy/*.sh

      # ── 变量名边界：`$VAR（` 这种写法在 macOS 上会炸 ──────────────
      #
      # 我们的脚本消息全是中文，于是「$ARTIFACT（$SIZE）」这类写法遍地都是。
      # 变量名到哪里结束，取决于 locale 与 bash 版本：Linux 的 bash 5 在第一个
      # 非 ASCII 字节处断开，**macOS 自带的 bash 3.2 会把那个字节吃进变量名**，
      # 于是报 `ARTIFACT?: unbound variable`。
      #
      # v0.1.0 第一次发版就栽在这里：Linux 与 Windows 全绿，
      # aarch64-apple-darwin 在打包那步挂掉，而**冒烟测试是通过的** ——
      # 也就是说产物本身没问题，是脚本自己在 macOS 上跑不完。
      # 当时全仓库有 36 处同款写法，一处都没被任何检查拦住。
      #
      # shellcheck 不报这个（它在语法上完全合法）。所以单开一条。
      # 用 Python 而不是 grep -P：后者在非 UTF-8 locale 下直接报
      # 「-P supports only unibyte and UTF-8 locales」并以非零码退出，
      # 而 `if grep …` 会把那个错误当成「没匹配」—— **守卫静默失效，一路绿灯**。
      # 这道检查本身就是为了防静默失效，它自己不能有静默失效。
      - name: 变量名边界（$VAR 后面紧跟中文标点）
        run: |
          python3 - <<'PY'
          import glob, io, re, sys
          pat = re.compile(rb'\$[A-Za-z_][A-Za-z0-9_]*[\xc0-\xf7]')
          bad = []
          for f in sorted(glob.glob('scripts/*.sh') + glob.glob('deploy/*.sh')):
              for n, line in enumerate(io.open(f, 'rb').read().split(b'\n'), 1):
                  if pat.search(line):
                      bad.append(f'{f}:{n}: {line.decode("utf-8", "replace").strip()}')
          if bad:
              for b in bad:
                  print(f'::error file={b.split(":")[0]},line={b.split(":")[1]}::变量名边界不确定')
                  print(b)
              print(f'\n共 {len(bad)} 处。$VAR 后面紧跟非 ASCII 字符时，'
                    '变量名到哪结束取决于 locale 与 bash 版本 —— '
                    'macOS 自带的 bash 3.2 会把那个字节吃进变量名。')
              print('改成 ${VAR} 即可：加一对花括号，不改语义。')
              sys.exit(1)
          print('✓ 没有边界不确定的变量展开')
          PY

      - name: python 语法检查
        run: python3 -m py_compile scripts/*.py

      # 版本号在四个地方出现（Cargo.toml / pubspec.yaml / git tag / 镜像 tag），
      # 语言不同、语法不同，没有任何一个工具会同时看到它们。漂移的失败方式是
      # `cortex --version` 说一个数、下载页写另一个数，而两边都编译得过。
      #
      # 放在**每个 PR** 上而不是只放在发布流水线里：发版当天才发现版本对不上，
      # 意味着要么带着错的版本号发出去，要么临时改一版重来
      - name: 版本号一致性
        run: bash scripts/check-version.sh

      # 发布产物必须随包带 LICENSE / NOTICE（Apache-2.0 的要求），
      # CHANGELOG 必须有当前版本的条目，仓库里不能有没被忽略的凭据文件。
      # 这几条在发布流水线里也会跑一遍，但那时已经太晚了
      - name: 发版前置闸门
        run: bash scripts/release-preflight.sh

      # 基线文件是回归门的全部依据。它自己损坏 / 缺字段的话，门会静静地失效 ——
      # 尤其是缺 embedding_model：那样换后端时就拦不住「拿 hash 的分去撞真实基线」
      - name: 评测基线文件自检
        run: python3 scripts/evals-gate.py verify-baseline scripts/evals-baseline.*.json

      - name: docker compose 配置可解析
        # 生产变体里若干变量用了 `${VAR:?}`，缺了就报错 —— 那正是它该有的
        # 行为（防止拿默认口令上生产）。这里喂假值只为让 config 能解析，
        # 不代表可以用弱口令。
        #
        # ⚠️ **必填变量是从 compose 里派生的，不是手工列的一张表。**
        #
        # 那张表在这儿维护过，也漏过两次，两次症状完全一样：本机
        # `docker compose config` 是**过的**（`.env` 里有那个值，compose 会
        # 自动读），一推上去 CI 才红 —— 这道门本来就是为「只有 CI 看得见」
        # 而设的，于是漏的人在本机得不到任何信号。
        #
        #   0.1.9  加了 CORMEX_VERSION / CORTEX_MEMORY_URL，没加进表
        #   0.1.9  加了 CORTEX_PG_PASSWORD（deploy 那份加自己的库），没加进表
        #
        # 第二次之后不再补名字：一张要靠人跟着改的清单，会一直漏第三次。
        # 下面这段自己去 compose 里把 `${VAR:?}` 捞出来，缺哪个补哪个。
        # 已经在环境里的（下面 env: 那几个）不覆盖 —— 有些值要像点样子。
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
          RUSTFS_SECRET_KEY: ci-syntax-check-only
          CORTEX_AUTH_TOKEN_SHA256: ci-syntax-check-only
          CORTEX_VERSION: v0.0.0-ci
          DOMAIN: ci.invalid
          S3_DOMAIN: s3.ci.invalid
          CORMEX_VERSION: v0.0.0-ci
          CORTEX_MEMORY_URL: http://memory.ci.invalid:8080
        run: |
          required=$(grep -ohE '\$\{[A-Z0-9_]+:\?' \
                       docker-compose*.yml deploy/*.yml \
                     | sed -E 's/^\$\{([A-Z0-9_]+):\?$/\1/' | sort -u)
          echo "compose 声明的必填变量：" $required
          for v in $required; do
            if [ -z "${!v:-}" ]; then
              echo "  · $v 没给值，喂一个假的"
              export "$v=ci-syntax-check-only"
            fi
          done

          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          # 线上真正跑的是这一份（deploy.yml 按它的 sha256 校验节点）。
          # 之前没检查它 —— 而一个语法坏掉的部署 compose，
          # 要到 workflow_dispatch 之后才在节点上暴露
          docker compose -f deploy/docker-compose.yml config -q

      - name: 边缘转得到每条路由
        # 这个仓库最熟的故障形状：代码加了路由、边缘不知道，**而症状是 200**。
        # dev 的 nginx 里 API 是枚举的，漏一条就落到 SPA 回落上，回
        # 200 + index.html —— 逐条打状态码的那种验证一次都发现不了。
        #
        # 数到第四次了（部署清单三次 + 生产边缘一次），第五次差点发生在加
        # /agents 的当天。理由与前两道闸相同：注释拦不住沉默的形状。
        run: python3 scripts/check-edge-routes.py

      - name: 文档链接指得到
        # 一条断链不报错、不影响构建，只是读文档的人点过去落进 404 ——
        # 而写文档的人永远不会去点自己刚写的链接。
        #
        # 这个脚本自己的 slug 算法返工过两次（把 `_` 剪了、把连续空白折叠了），
        # 两次都是**假阳性**，而假阳性比漏报更贵：它训练人忽略输出。
        # 算法照 github-slugger 抄，理由逐条写在脚本的模块文档里。
        run: python3 scripts/check-doc-links.py

      - name: 代码读的环境变量，compose 都设得了
        # 「造好了没人调用」在部署这一层的样子：代码认真读一个变量、
        # `.env.example` 认真列着、文档认真写了怎么配 —— 而 compose 根本没把
        # 它透进容器。那个功能于是对**它面向的所有用户**都不存在，且不报错。
        #
        # 2026-08-17 一天之内碰到两个：`S3_*`（附件从 agentd 接手起就没在
        # 生产上通过，`/health` 一直答 blobs: disabled）与 `CORTEX_ADMIN_*`
        # （「只有 compose、没有 shell 的人怎么建第一个账号」，代码写好了而
        # 那两行不在 compose 里）。两次都是靠人肉比对发现的。
        run: |
          bash scripts/check-compose-env.sh deploy/docker-compose.yml
          bash scripts/check-compose-env.sh docker-compose.dev.yml

  # ── 测试 ───────────────────────────────────────────────
  test:
    name: 测试
    runs-on: ubuntu-latest

    # **这里没有 Postgres，也没有 migration。**
    #
    # 记忆那一半在 2026-08 搬去了 Cormex，连同 `migrations/`。此前这个作业
    # 还在起 pgvector 容器、跑 `sqlx migrate run` —— 而目录已经不在了，
    # 于是第一次真推上去就红：`error canonicalizing path migrations`。
    #
    # 值得记一笔的是**它为什么拖到今天才红**：拆分那几个提交都在本地验证
    # （`cargo test` 不碰这一段），而 CI 的这一段只有推上去才跑。
    # 「本地全绿」与「CI 全绿」是两件事，这一次差在一个已经不存在的目录上。
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # ── 客户端 ─────────────────────────────────────────────
  #
  # 到 0.1.9 为止，这条流水线**只跑 Rust** —— 而客户端有 300 条测试、
  # 一个类型检查器，一次都没在 CI 上跑过。也就是说：改 Dart 的 PR 在
  # 这里是全绿的，绿得和没改一样。
  #
  # 实际后果不是假想的。删记忆界面那次（2600 行）与这次接 MCP，Flutter
  # 侧的每一次 analyze / test 都是人在本机手跑的；漏跑一次的症状是
  # 「合进去了，下一个人 checkout 出来编不过」。
  #
  # 单开一个 job 而不是挂在 `test` 后面：Rust 与 Flutter 各装各的工具链，
  # 串起来会让一个纯 Rust 的改动多等三四分钟装 Flutter SDK。
  flutter:
    name: 客户端（analyze + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      # `channel: stable` 而不是钉死版本号，**与 release.yml 保持一致**。
      #
      # 钉版本能让 CI 不受上游发版影响，代价更大：这道门就会在一个与打包
      # 用的 SDK 不同的版本上跑 —— 于是它能全绿，而 release 那边编不过。
      # 一道拦不住发布失败的门没有意义。
      #
      # ⚠️ **代价 2026-08-16 兑现了一次，值得写下来。** 上游 stable 走到
      # 3.47.0（Dart 3.13）之后，`dart format` 对 record 字面量的排法变了，
      # 于是 `test/history_replay_test.dart` 在**没有任何人改过它**的情况下
      # 让 CI 变红 —— 上一次绿的那笔提交也没动过它。
      #
      # 这就是浮动版本的形状：**红灯与代码改动无关**，查的人会先去翻自己
      # 那几笔。看到 `dart format` 红而 diff 里没有 .dart 文件时，先对一下
      # 本机与 CI 的 Flutter 版本（本机 `flutter --version`，CI 日志里搜
      # `stable-`），八成就是这条。
      #
      # 跟上游的做法是**升本机**，不是钉 CI：两边一起浮动才保住上面那条
      # 「CI 与 release 用同一个 SDK」。升的时候顺手全量重排一遍格式，
      # 那一笔只有格式改动，单独提交。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 等价于 Rust 那边的 `cargo fmt --check`。
      #
      # 加它的直接原因：上一个提交里有几处断行是脚本改出来的
      # （`class _GateApi with` 那种），人看 diff 不会注意，而它会在下一次
      # 有人跑 `dart format` 时变成一堆与那次改动无关的噪音行。
      #
      # 放在 analyze **之前**：格式问题一眼能改，让它先报，省得人先去读
      # 一屏 analyze 输出才发现真正要改的只是排版
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      # 等价于 Rust 那边的 clippy。`analysis_options.yaml` 里开了额外的 lint，
      # 所以这一步不只是类型检查
      - name: flutter analyze
        run: flutter analyze

      # `live_backend_test.dart` / `live_render_test.dart` **自己会跳过**：
      # 它们先探一次 127.0.0.1:5173（600ms 超时），连不上就 `markTestSkipped`。
      # CI 上没有那个部署，于是它们静静跳过 —— 不必在这里排除文件名，
      # 而「排除文件名」那种做法迟早会把一个新加的用例一起排除掉。
      - name: flutter test
        run: flutter test

  # ── 构建 ───────────────────────────────────────────────
  build:
    name: 构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release
