name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ⚠️ `RUSTFLAGS: -D warnings` **刻意不在这里**，它按作业单独设。
#
# 放顶层的代价不是编译慢，是**发版永远命中不了缓存**：rust-cache 把
# `RUST*` 环境变量算进缓存键，而 release.yml 不设这个变量 —— 于是同一台
# windows runner 上编同一份代码的两个作业，键的那一段一个是 af4551b0、
# 一个是 982710c9，永不相交。（实测 v0.1.11：发版的 Windows 作业
# `No cache found.`，冷编 14.4 分。）
#
# 而且**硬凑成一样也没用**：cargo 自己的 fingerprint 同样含 RUSTFLAGS，
# 缓存就算恢复了也会全量重编。两边必须是同一个值，或者都不设。
#
# 「都不设」在 `build` 上是安全的：那个作业回答的是「三个平台上编不编得过」，
# 而警告的把关在 `lint` 那条 —— 它命令行上就带着 `-D warnings`。

jobs:
  # ── 格式与静态检查 ──────────────────────────────────────
  lint:
    name: 格式与 Clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  # ── 运维脚本 ───────────────────────────────────────────
  # 备份 / 恢复脚本最糟的失效方式是：平时没人跑，需要它的那天才发现
  # 第 200 行有个语法错。这道门只花几秒，挡的正是这一类。
  scripts:
    name: 运维脚本静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ⚠️ **不在这里重写命令，调那份脚本。**
      #
      # 这三步原先是 inline 的（bash -n / shellcheck / 变量边界），与
      # `scripts/lint-sh.sh` 各写一份 —— 2026-08-23 兑现了：那边把
      # `deploy/*.sh` 换成了 find（`deploy/` 里最后一个脚本被 ansible 取代
      # 删掉之后，那个 glob 展不开、shellcheck 报 "does not exist"），
      # 而这里那份没跟着改，于是 CI 红而本机绿。
      #
      # `check-ci-parity.py` 拦不住这种：它比对的是**步骤名**，不是步骤做的事
      # （那份文件自己写着这一点）。所以根治办法是让两边跑同一个文件 ——
      # `check-var-boundaries.py` 2026-08-22 已经这么做过一次，只是当时
      # 只抽了三步里的一步。
      #
      # 用 `bash scripts/…` 而不是 `just lint-sh`：runner 上没有 just，
      # 而为一步检查装它不划算。跑的是同一个文件，这就够了。
      - name: shell 脚本这一关（语法 / shellcheck / 变量边界）
        run: bash scripts/lint-sh.sh

      - name: python 语法检查
        run: python3 -m py_compile scripts/*.py

      # 版本号在四个地方出现（Cargo.toml / pubspec.yaml / git tag / 镜像 tag），
      # 语言不同、语法不同，没有任何一个工具会同时看到它们。漂移的失败方式是
      # `cortex --version` 说一个数、下载页写另一个数，而两边都编译得过。
      #
      # 放在**每个 PR** 上而不是只放在发布流水线里：发版当天才发现版本对不上，
      # 意味着要么带着错的版本号发出去，要么临时改一版重来
      - name: 版本号一致性
        run: bash scripts/check-version.sh

      # 发布产物必须随包带 LICENSE / NOTICE（Apache-2.0 的要求），
      # CHANGELOG 必须有当前版本的条目，仓库里不能有没被忽略的凭据文件。
      # 这几条在发布流水线里也会跑一遍，但那时已经太晚了
      - name: 发版前置闸门
        run: bash scripts/release-preflight.sh

      # 基线文件是回归门的全部依据。它自己损坏 / 缺字段的话，门会静静地失效 ——
      # 尤其是缺 embedding_model：那样换后端时就拦不住「拿 hash 的分去撞真实基线」
      - name: 评测基线文件自检
        run: python3 scripts/evals-gate.py verify-baseline scripts/evals-baseline.*.json

      - name: docker compose 配置可解析
        # 生产变体里若干变量用了 `${VAR:?}`，缺了就报错 —— 那正是它该有的
        # 行为（防止拿默认口令上生产）。这里喂假值只为让 config 能解析，
        # 不代表可以用弱口令。
        #
        # ⚠️ **必填变量是从 compose 里派生的，不是手工列的一张表。**
        #
        # 那张表在这儿维护过，也漏过两次，两次症状完全一样：本机
        # `docker compose config` 是**过的**（`.env` 里有那个值，compose 会
        # 自动读），一推上去 CI 才红 —— 这道门本来就是为「只有 CI 看得见」
        # 而设的，于是漏的人在本机得不到任何信号。
        #
        #   0.1.9  加了 CORMEX_VERSION / CORTEX_MEMORY_URL，没加进表
        #   0.1.9  加了 CORTEX_PG_PASSWORD（deploy 那份加自己的库），没加进表
        #
        # 第二次之后不再补名字：一张要靠人跟着改的清单，会一直漏第三次。
        # 下面这段自己去 compose 里把 `${VAR:?}` 捞出来，缺哪个补哪个。
        # 已经在环境里的（下面 env: 那几个）不覆盖 —— 有些值要像点样子。
        env:
          POSTGRES_PASSWORD: ci-syntax-check-only
          RUSTFS_SECRET_KEY: ci-syntax-check-only
          CORTEX_AUTH_TOKEN_SHA256: ci-syntax-check-only
          CORTEX_VERSION: v0.0.0-ci
          DOMAIN: ci.invalid
          S3_DOMAIN: s3.ci.invalid
          CORMEX_VERSION: v0.0.0-ci
          CORTEX_MEMORY_URL: http://memory.ci.invalid:8080
        run: |
          required=$(grep -ohE '\$\{[A-Z0-9_]+:\?' \
                       docker-compose*.yml deploy/*.yml \
                     | sed -E 's/^\$\{([A-Z0-9_]+):\?$/\1/' | sort -u)
          echo "compose 声明的必填变量：" $required
          for v in $required; do
            if [ -z "${!v:-}" ]; then
              echo "  · $v 没给值，喂一个假的"
              export "$v=ci-syntax-check-only"
            fi
          done

          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          # 线上真正跑的是这一份（deploy.yml 按它的 sha256 校验节点）。
          # 之前没检查它 —— 而一个语法坏掉的部署 compose，
          # 要到 workflow_dispatch 之后才在节点上暴露
          docker compose -f deploy/docker-compose.yml config -q

      - name: 边缘转得到每条路由
        # 这个仓库最熟的故障形状：代码加了路由、边缘不知道，**而症状是 200**。
        # dev 的 nginx 里 API 是枚举的，漏一条就落到 SPA 回落上，回
        # 200 + index.html —— 逐条打状态码的那种验证一次都发现不了。
        #
        # 数到第四次了（部署清单三次 + 生产边缘一次），第五次差点发生在加
        # /agents 的当天。理由与前两道闸相同：注释拦不住沉默的形状。
        run: python3 scripts/check-edge-routes.py

      - name: 文档链接指得到
        # 一条断链不报错、不影响构建，只是读文档的人点过去落进 404 ——
        # 而写文档的人永远不会去点自己刚写的链接。
        #
        # 这个脚本自己的 slug 算法返工过两次（把 `_` 剪了、把连续空白折叠了），
        # 两次都是**假阳性**，而假阳性比漏报更贵：它训练人忽略输出。
        # 算法照 github-slugger 抄，理由逐条写在脚本的模块文档里。
        run: python3 scripts/check-doc-links.py

      - name: 圆角走那五阶
        # 又一次「注释拦不住沉默的形状」：design.md 第四节从第一天就写着
        # 「不要每处现编一个数」，而 2026-08-21 清点出 42 处现编的、
        # 14 个互不相同的值。一个 `circular(9)` 在 review 里看起来完全无害，
        # 只有把所有值排在一起才看得出它们互相不一致。
        #
        # 例外（胶囊、字形）靠紧邻注释里的「不走圆角」放行 —— 要求写出理由
        # 而不是维护一张豁免清单，因为清单会和代码脱钩。
        run: python3 scripts/check-radii.py

      - name: 代码读的环境变量，compose 都设得了
        # 「造好了没人调用」在部署这一层的样子：代码认真读一个变量、
        # `.env.example` 认真列着、文档认真写了怎么配 —— 而 compose 根本没把
        # 它透进容器。那个功能于是对**它面向的所有用户**都不存在，且不报错。
        #
        # 2026-08-17 一天之内碰到两个：`S3_*`（附件从 agentd 接手起就没在
        # 生产上通过，`/health` 一直答 blobs: disabled）与 `CORTEX_ADMIN_*`
        # （「只有 compose、没有 shell 的人怎么建第一个账号」，代码写好了而
        # 那两行不在 compose 里）。两次都是靠人肉比对发现的。
        run: |
          bash scripts/check-compose-env.sh deploy/docker-compose.yml
          bash scripts/check-compose-env.sh docker-compose.dev.yml

      # 上面每一步都要在 `just ci` 里也跑得到 —— 否则本机的绿是假的。
      #
      # 这句话以前只是 `just ci` 上面的一句注释，而注释不校验自己：
      # 2026-08-20（文档链接）与 08-22（compose 变量）各烂过一次，两次都是
      # 本机全绿、推上去才红，一来一回二十多分钟。
      #
      # **这一步放在最后**：它是关于这个作业本身的，前面全绿了它才有话可说。
      - name: 本机 just ci 跑得到 CI 的每一步
        run: python3 scripts/check-ci-parity.py

  # ── 测试 ───────────────────────────────────────────────
  test:
    name: 测试
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings

    # **这里没有 Postgres，也没有 migration。**
    #
    # 记忆那一半在 2026-08 搬去了 Cormex，连同 `migrations/`。此前这个作业
    # 还在起 pgvector 容器、跑 `sqlx migrate run` —— 而目录已经不在了，
    # 于是第一次真推上去就红：`error canonicalizing path migrations`。
    #
    # 值得记一笔的是**它为什么拖到今天才红**：拆分那几个提交都在本地验证
    # （`cargo test` 不碰这一段），而 CI 的这一段只有推上去才跑。
    # 「本地全绿」与「CI 全绿」是两件事，这一次差在一个已经不存在的目录上。
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # ── 客户端 ─────────────────────────────────────────────
  #
  # 到 0.1.9 为止，这条流水线**只跑 Rust** —— 而客户端有 300 条测试、
  # 一个类型检查器，一次都没在 CI 上跑过。也就是说：改 Dart 的 PR 在
  # 这里是全绿的，绿得和没改一样。
  #
  # 实际后果不是假想的。删记忆界面那次（2600 行）与这次接 MCP，Flutter
  # 侧的每一次 analyze / test 都是人在本机手跑的；漏跑一次的症状是
  # 「合进去了，下一个人 checkout 出来编不过」。
  #
  # 单开一个 job 而不是挂在 `test` 后面：Rust 与 Flutter 各装各的工具链，
  # 串起来会让一个纯 Rust 的改动多等三四分钟装 Flutter SDK。
  flutter:
    name: 客户端（analyze + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      # ⚠️ **钉死版本，不用 `channel: stable`。**
      #
      # 这里从前是 `channel: stable`，理由是「CI 与 release 必须用同一个
      # SDK，否则这道门能全绿而 release 编不过」——那条约束没变，
      # **变的是满足它的方式**：两条流水线现在读同一个
      # `app/pubspec.yaml` 的 `environment.flutter`，于是它们必然同版本，
      # 而且那个版本是仓库里写着的，不是「今天上游发到哪儿」。
      #
      # 浮动的代价 2026-08-16 兑现过一次：上游 stable 走到 3.47.0 之后
      # `dart format` 对 record 字面量的排法变了，于是
      # `test/history_replay_test.dart` 在**没有任何人改过它**的情况下
      # 让 CI 变红 —— 红灯与代码改动无关，查的人会先去翻自己那几笔。
      #
      # 升级从此是一次**明确的提交**：`flutter upgrade` → 改 pubspec 那一行
      # → 跑 `just ci`。不兼容当场看得见，而不是某天早上突然红。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 等价于 Rust 那边的 `cargo fmt --check`。
      #
      # 加它的直接原因：上一个提交里有几处断行是脚本改出来的
      # （`class _GateApi with` 那种），人看 diff 不会注意，而它会在下一次
      # 有人跑 `dart format` 时变成一堆与那次改动无关的噪音行。
      #
      # 放在 analyze **之前**：格式问题一眼能改，让它先报，省得人先去读
      # 一屏 analyze 输出才发现真正要改的只是排版
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      # 等价于 Rust 那边的 clippy。`analysis_options.yaml` 里开了额外的 lint，
      # 所以这一步不只是类型检查
      - name: flutter analyze
        run: flutter analyze

      # `live_backend_test.dart` / `live_render_test.dart` **自己会跳过**：
      # 它们先探一次 127.0.0.1:5173（600ms 超时），连不上就 `markTestSkipped`。
      # CI 上没有那个部署，于是它们静静跳过 —— 不必在这里排除文件名，
      # 而「排除文件名」那种做法迟早会把一个新加的用例一起排除掉。
      - name: flutter test
        run: flutter test

  # ── 构建 ───────────────────────────────────────────────
  build:
    name: 构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # 与发版那个 build 作业共用一份缓存（见 release.yml 里那段长注释）。
      # **这一份是发版唯一可能命中的来源** —— tag 读不到别的 tag 的缓存，
      # 只读得到默认分支的，所以这里存下来的东西就是那 28 分钟冷编译的解药。
      #
      # 键里仍然带平台（`Linux-x64` / `Windows-x64`…），三个 os 不会互相覆盖。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.os }}

      # ⚠️ **Windows 那条腿必须带 `--target`，否则上面那份缓存对发版无效。**
      #
      # release.yml 的 build 作业跑的是
      # `cargo build --release --target x86_64-pc-windows-msvc`，而这里原先
      # 跑的是不带 target 的版本。两者在 cargo 眼里是**两个输出目录**
      # （`target/release` 与 `target/x86_64-pc-windows-msvc/release`），
      # 指纹各算各的 —— 于是 `shared-key` 明明对上了、依赖包也都下下来了，
      # 发版那一侧还是从零编一遍整个依赖树。
      #
      # 这是最难发现的一类浪费：缓存命中率是绿的，下载量是对的，
      # 只有墙钟时间说不通，而没人会为一次「本来就慢」的发版去查它。
      #
      # 写成两个 `if:` 步骤而不是一个带条件 env 的步骤：
      # `CARGO_BUILD_TARGET` 取空串时 cargo 的行为没有明确文档，
      # 而这条路径一年只被人看两次 —— 不该留一个要去查 cargo 源码的地方。
      - name: cargo build --release
        if: matrix.os != 'windows-latest'
        run: cargo build --workspace --release

      - name: cargo build --release（三元组对齐发版）
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      # ⚠️ **这是 Windows 沙箱唯一的 CI 覆盖。**
      #
      # 上面那个 `test` 作业只跑 ubuntu，而 `sandbox/windows.rs` 是
      # `#[cfg(windows)]` 的 —— 也就是说 AppContainer 后端与它那七条逃逸测试
      # 在 CI 上**一行都没被执行过**。一个只在开发者本机被验证过的安全边界，
      # 迟早会在某次「顺手改一下」之后静默失效。
      #
      # 只跑这两个目标，不跑整个 workspace：这条腿的作用是**守住边界**，
      # 不是第二遍跑全量测试（那要再花十几分钟，而 ubuntu 那边已经跑过了）。
      #
      # 两个后端各有一份逃逸测试，**都要跑**：漏掉哪个，那个后端的边界就
      # 只剩开发者本机验证过一次。两份都是 `harness = false` 的——那个测试
      # 二进制自己就是沙箱 helper，所以验的必然是刚编出来的这份代码。
      #
      # 带 `--target` 的理由与上面那条 build 一样：不带的话输出目录不同，
      # 依赖树要重编一遍。
      - name: 沙箱逃逸测试（Windows）
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p cortex-agent --target x86_64-pc-windows-msvc --lib sandbox
          cargo test -p cortex-agent --target x86_64-pc-windows-msvc --test sandbox_escape_windows
          cargo test -p cortex-agent --target x86_64-pc-windows-msvc --test sandbox_restricted_windows
