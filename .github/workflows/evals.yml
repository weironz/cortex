name: 检索评测

# 检索质量是这个项目的差异化卖点，而它**可以在没人察觉的情况下退化** ——
# 编译过、测试过、接口没变，只是召回悄悄变差了。
# 这条 workflow 存在的唯一目的就是让那件事变红。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 UTC 19:00（北京时间次日 03:00）跑一次真实语义后端那道门。
    # 它比 PR 那道慢得多，不适合挡在每次提交前面，但必须定期跑 ——
    # hash 后端测不到语义那一路的退化。
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════
  #  第一道门：题集静态校验 —— 秒级，不需要任何服务
  # ══════════════════════════════════════════════════════════
  suite:
    name: 题集校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: evals

      - name: 静态校验题集
        run: cargo run -p cortex-evals --release -- validate

      # 题集完整性测试挡的是「死题」：gold 匹配不到任何铺垫事实（恒假）、
      # gold 与 forbidden 命中同一条（永远判不对）、某题型题量掉到 8 以下
      # （单题抖动会淹没信号）。这些都是加新题时最容易犯的错。
      - name: 题集完整性测试
        run: cargo test -p cortex-evals --release

  # ══════════════════════════════════════════════════════════
  #  第二道门：逐题型回归 —— 每个 PR 都跑
  #
  #  用 hash 向量后端。取舍写在 docs/operations.md，简述：
  #    真实模型要下 590 MB，即使有缓存也要多花一两分钟，
  #    而 hash 后端在本题集上的总分与真实后端只差 0.016（0.907 vs 0.923），
  #    足以挡住 BM25 / 图遍历 / 融合 / SQL / 注入预算这些路的退化。
  #  它**测不到**的是语义那一路本身，那由下面的 semantic job 定期兜。
  # ══════════════════════════════════════════════════════════
  regression:
    name: 检索回归门（hash 后端）
    runs-on: ubuntu-latest
    needs: suite

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_ci
          POSTGRES_DB: cortex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cortex:cortex_ci@localhost:5432/cortex
      # 评测自己会建临时 schema 并在里面跑 migration，不需要 sqlx-cli
      CORTEX_EMBED_BACKEND: hash

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: evals

      - name: 跑评测
        run: |
          cargo run -p cortex-evals --release -- run \
            --mode seed \
            --json evals-report.json \
            --md   evals-report.md

      # 逐题型比对基线。只比总分是不够的：某一类塌了而总分微跌，
      # 只看总分的门会放它过去 —— 见 scripts/evals-gate.py 的文件头。
      - name: 回归门（逐题型 diff）
        run: |
          python3 scripts/evals-gate.py check \
            --report   evals-report.json \
            --baseline scripts/evals-baseline.hash.json \
            | tee gate.txt

      - name: 报告进 Job Summary
        if: always()
        run: |
          {
            echo '## 检索评测（hash 后端）'
            echo '```'
            cat gate.txt 2>/dev/null || echo '（回归门没跑起来）'
            echo '```'
            echo '<details><summary>完整报告</summary>'
            echo
            cat evals-report.md 2>/dev/null || true
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report-hash
          path: |
            evals-report.json
            evals-report.md
            gate.txt
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  #  第三道门：真实语义后端 —— 只在 main / 定时 / 手动触发
  #
  #  为什么不放进 PR：模型 590 MB。有 actions/cache 时恢复要 30–60 s，
  #  缓存未命中（换模型、缓存被逐出）时要从 HuggingFace 现下，
  #  在高峰期能拖到好几分钟，而且是**外部依赖** —— 会变成与代码无关的红灯。
  #  放在 main 与每日定时上，既守住了语义那一路，又不让每个 PR 赌运气。
  # ══════════════════════════════════════════════════════════
  semantic:
    name: 检索回归门（真实语义后端）
    runs-on: ubuntu-latest
    needs: suite
    if: github.event_name != 'pull_request'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_ci
          POSTGRES_DB: cortex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cortex:cortex_ci@localhost:5432/cortex
      # ── 这道门刻意仍然用**进程内**后端（feature `local-embed`）──
      #
      # 默认后端已经改成了 `api`（调远端 /v1/embeddings），但这里不能跟着换：
      # `scripts/evals-baseline.*.json` 里的每一个数字都是在
      # `fastembed:gpahal/bge-m3-onnx-int8` 这个空间里量出来的，
      # 连语义地板 0.50 都是在它上面扫出来的曲线。
      #
      # 换成远端跑的 bge-m3 **不是同一个空间**（fp32 vs int8、池化实现不同），
      # 拿旧基线去撞新分数没有意义 —— 基线文件里记着 embedding_model，
      # 回归门会核对它，正是为了拦住这种事。
      #
      # 要把这道门换到 api 后端，得先重扫一遍曲线并换一份基线，
      # 那是一件独立的工作，不该顺手塞进「换默认后端」这个改动里。
      CORTEX_EMBED_BACKEND: fast
      CORTEX_EMBED_MODEL: bge-m3-int8
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/cortex-models

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: evals

      # key 里带模型名：换模型自动换缓存槽，不会拿着旧模型跑出「基线对不上」
      - name: 缓存 embedding 模型
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/cortex-models
          key: fastembed-bge-m3-int8-v1

      # `--features cortex-memory/local-embed` 不能省：fastembed 默认已经
      # 不编进来了。省掉的话不是编译失败，而是**运行期**报
      # 「CORTEX_EMBED_BACKEND=fast 需要 feature local-embed」——
      # 那条错误信息就是为这一刻写的（见 embed.rs 的 build_embedder）
      - name: 跑评测
        run: |
          cargo run -p cortex-evals --release \
            --features cortex-memory/local-embed -- run \
            --mode seed \
            --json evals-report.json \
            --md   evals-report.md

      - name: 回归门（逐题型 diff）
        run: |
          python3 scripts/evals-gate.py check \
            --report   evals-report.json \
            --baseline scripts/evals-baseline.fastembed.json \
            | tee gate.txt

      - name: 报告进 Job Summary
        if: always()
        run: |
          {
            echo '## 检索评测（真实语义后端）'
            echo '```'
            cat gate.txt 2>/dev/null || echo '（回归门没跑起来）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report-fastembed
          path: |
            evals-report.json
            evals-report.md
            gate.txt
          if-no-files-found: warn

# ── 为什么 --mode llm 不在这里 ────────────────────────────
#
# evals/README.md 已经定案：llm 模式真调抽取模型，结果随模型版本漂移，
# 做回归门会变成随机红灯 —— 一条会随机变红的门，两周内就会被所有人无视，
# 那时它连真正的回归都拦不住了。
# 而且 CI 里根本没有 DEEPSEEK_API_KEY（也不该有：任何 fork 的 PR 都能读到
# 它能读到的 secret）。llm 模式的位置是「定期人工跑一次，看抽取质量」。
